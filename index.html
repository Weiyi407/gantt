// ====================================================================
// ===== 改进表模块(与上方甘特图完全独立,互不影响) =====
// 数据结构: { machine, stage, owner, improvement }
// 存储: localStorage key = 'improvements_v1_data'
// 导入: .xlsx 读第 2 个 sheet / .csv 整文件
// ====================================================================
var IMPROVE_KEY = 'improvements_v1_data';
var improveData = [];

function loadImprovements() {
  try {
    var s = localStorage.getItem(IMPROVE_KEY);
    improveData = s ? JSON.parse(s) : [];
    if (!Array.isArray(improveData)) improveData = [];
  } catch(e) { improveData = []; }
  // 自动清理:丢掉无阶段的空行,同"机型+阶段"合并为一行(兼容旧版本导入的数据)
  var cleaned = normalizeImproveData(improveData);
  if (cleaned.length !== improveData.length) {
    improveData = cleaned;
    saveImprovements();
  } else {
    improveData = cleaned;
  }
}

// 按"机型+阶段"聚合:空阶段行丢弃;同键责任人取首个非空;改进去重用"；"拼接
function normalizeImproveData(arr) {
  var map = {}, order = [];
  for (var i = 0; i < arr.length; i++) {
    var r = arr[i] || {};
    var machine = String(r.machine == null ? '' : r.machine).trim();
    var stage = String(r.stage == null ? '' : r.stage).trim();
    if (!stage) continue;
    var owner = String(r.owner == null ? '' : r.owner).trim();
    var imp = String(r.improvement == null ? '' : r.improvement).trim();
    var key = machine + '||' + stage;
    if (map[key] == null) {
      map[key] = { machine: machine, stage: stage, owner: owner, imps: [] };
      order.push(key);
    }
    var a = map[key];
    if (!a.owner && owner) a.owner = owner;
    if (imp && a.imps.indexOf(imp) < 0) a.imps.push(imp);
  }
  return order.map(function(k) {
    var a = map[k];
    return { machine: a.machine, stage: a.stage, owner: a.owner, improvement: a.imps.join('；') };
  });
}
function saveImprovements() { localStorage.setItem(IMPROVE_KEY, JSON.stringify(improveData)); }

function renderImprovementsTable() {
  var tbody = document.getElementById('improveBody');
  var empty = document.getElementById('improveEmpty');
  if (!tbody) return;
  tbody.innerHTML = '';
  if (improveData.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  for (var i = 0; i < improveData.length; i++) {
    var r = improveData[i] || {};
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><textarea data-i="' + i + '" data-k="machine">' + esc(r.machine || '') + '</textarea></td>' +
      '<td><textarea data-i="' + i + '" data-k="stage">' + esc(r.stage || '') + '</textarea></td>' +
      '<td><textarea data-i="' + i + '" data-k="owner">' + esc(r.owner || '') + '</textarea></td>' +
      '<td><textarea data-i="' + i + '" data-k="improvement" rows="2">' + esc(r.improvement || '') + '</textarea></td>';
    tbody.appendChild(tr);
  }
  // 绑定编辑事件
  tbody.querySelectorAll('textarea').forEach(function(el) {
    el.addEventListener('change', function() {
      var idx = parseInt(el.getAttribute('data-i'), 10);
      var key = el.getAttribute('data-k');
      if (improveData[idx]) {
        improveData[idx][key] = el.value;
        saveImprovements();
      }
    });
  });
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function addImproveRow() {
  improveData.push({ machine: '', stage: '', owner: '', improvement: '' });
  saveImprovements();
  renderImprovementsTable();
  // 滚动到底部并聚焦新行第一列
  var wrap = document.getElementById('improveTableWrap');
  wrap.scrollTop = wrap.scrollHeight;
  var body = document.getElementById('improveBody');
  var firstTA = body.querySelector('tr:last-child textarea');
  if (firstTA) firstTA.focus();
}

function delImproveRow(i) {
  improveData.splice(i, 1);
  saveImprovements();
  renderImprovementsTable();
}

function clearImprovements() {
  if (!confirm('确定清空说明表所有数据吗？')) return;
  improveData = [];
  saveImprovements();
  renderImprovementsTable();
}

// 列识别:与甘特图同CSV时 machine 固定A列(0),stage/owner/improvement 按表头关键字识别
function findImproveCol(cols, re) {
  for (var i = 0; i < cols.length; i++) if (re.test(cols[i])) return i;
  return -1;
}
function mapImproveCols(header) {
  var idx = {
    machine: 0,   // 固定A列(资源=机型)
    type: -1,     // 类型列(计划/实际),有则过滤实际行
    stage: -1,
    owner: -1,
    improvement: -1
  };
  // 识别"类型"列(用于过滤实际行)
  idx.type = findImproveCol(header, /^类型$|^type$|^计划\s*\/\s*实际$/i);
  // stage/owner/improvement:先匹配"改进"前缀,再匹配无前缀
  idx.stage = findImproveCol(header, /^改进阶段|改进.*阶段|阶段|stage/i);
  idx.owner = findImproveCol(header, /责任人|负责人|负责|owner/i);
  idx.improvement = findImproveCol(header, /^改进|^说明|改进措施|改进.*描述|说明.*描述|improvement|action|remark|note/i);
  // 兜底:按列位置(甘特图CSV里 H=7, I=8, J=9)
  if (idx.stage < 0) idx.stage = 7;
  if (idx.owner < 0) idx.owner = 8;
  if (idx.improvement < 0) idx.improvement = 9;
  return idx;
}

// 把二维数组(第 0 行为表头)转换为改进表数据
// silent=true(统一导入时):无数据不弹窗、不清空已有数据;有数据也不弹成功提示
function applyImprovementsRows(rows, silent) {
  if (!rows || rows.length < 2) {
    if (!silent) alert('未识别到数据行（仅有表头或为空）');
    return false;
  }
  var header = rows[0].map(function(s){ return String(s == null ? '' : s).trim(); });
  var idx = mapImproveCols(header);
  // 按 "机型||阶段" 聚合:每个机型每个阶段只保留一行
  var aggMap = {};
  var aggOrder = [];
  var skippedActual = 0, skippedNoStage = 0;
  for (var i = 1; i < rows.length; i++) {
    var r = rows[i] || [];
    // 有 type 列时:只取含"计划"的行,跳过"实际"行
    if (idx.type >= 0) {
      var typeVal = (r[idx.type] != null ? String(r[idx.type]) : '').trim();
      if (/实|actual/i.test(typeVal)) { skippedActual++; continue; }
      // 空 type 也跳过(可能是表头分隔行)
      if (!typeVal) { continue; }
    }
    var machine = (r[idx.machine] != null ? String(r[idx.machine]) : '').trim();
    var stage = (r[idx.stage] != null ? String(r[idx.stage]) : '').trim();
    var owner = (r[idx.owner] != null ? String(r[idx.owner]) : '').trim();
    var improvement = (r[idx.improvement] != null ? String(r[idx.improvement]) : '').trim();
    // 阶段为空的行跳过(甘特图CSV里阶段只在该阶段首个任务行填写,其余任务行无意义)
    if (!stage) { skippedNoStage++; continue; }
    var key = machine + '||' + stage;
    if (aggMap[key] == null) {
      aggMap[key] = { machine: machine, stage: stage, owner: owner, improvements: [] };
      aggOrder.push(key);
    }
    var agg = aggMap[key];
    if (!agg.owner && owner) agg.owner = owner;       // 责任人取第一个非空
    if (improvement && agg.improvements.indexOf(improvement) < 0) {
      agg.improvements.push(improvement);             // 多条改进去重后合并
    }
  }
  var newData = aggOrder.map(function(k) {
    var a = aggMap[k];
    return { machine: a.machine, stage: a.stage, owner: a.owner, improvement: a.improvements.join('；') };
  });
  if (newData.length === 0) {
    // 静默模式:文件里没有改进数据,保留表里现有内容,什么都不做
    if (!silent) alert('未识别到有效数据行！(已跳过 ' + skippedActual + ' 行实际行、' + skippedNoStage + ' 行无阶段行)');
    return false;
  }
  improveData = newData;
  saveImprovements();
  renderImprovementsTable();
  if (!silent) {
    var msg = '✓ 已导入 ' + newData.length + ' 条说明记录';
    if (skippedActual) msg += '(跳过 ' + skippedActual + ' 行实际行)';
    alert(msg);
  }
  return true;
}

// CSV 解析(简易:支持逗号/分号/Tab 分隔)
function parseImproveCSV(text, silent) {
  // 兼容 UTF-8 BOM
  text = text.replace(/^\ufeff/, '');
  var lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').filter(function(l){ return l.trim(); });
  if (lines.length < 2) {
    if (!silent) alert('CSV 内容不足 2 行');
    return;
  }
  // 自动判断分隔符:逗号 / 分号 / 制表符
  var delim = ',';
  var sample = lines[0];
  if ((sample.match(/\t/g) || []).length > (sample.match(/,/g) || []).length) delim = '\t';
  else if ((sample.match(/;/g) || []).length > (sample.match(/,/g) || []).length) delim = ';';
  var rows = lines.map(function(l){ return l.split(delim); });
  applyImprovementsRows(rows, silent);
}

function exportImprovements() {
  if (improveData.length === 0) { alert('说明表为空'); return; }
  var csv = '\ufeff机型,阶段,责任人,说明\n';
  for (var i = 0; i < improveData.length; i++) {
    var r = improveData[i] || {};
    // CSV 字段内逗号/换行/引号转义
    function q(s) {
      s = String(s == null ? '' : s);
      if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
      return s;
    }
    csv += q(r.machine) + ',' + q(r.stage) + ',' + q(r.owner) + ',' + q(r.improvement) + '\n';
  }
  var blob = new Blob([csv], {type:'text/csv'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'improvements_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

// 初始化改进表(独立于甘特图)
loadImprovements();
renderImprovementsTable();

</script>
