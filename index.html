  if (task.indexOf('首台装配') !== -1) return 0;
  if (task.indexOf('测试问题闭环') !== -1) return 2;
  if (task.indexOf('测试完成') !== -1) return 1;
  if (task.indexOf('归档') !== -1 || task.indexOf('发布') !== -1 || task.indexOf('提单') !== -1) return 3;
  return 3; // 兜底最深
}

// 判断十六进制颜色是否为浅色(用于自动选择标签文字颜色)
function isLightColor(hex) {
  var m = /^#?([0-9a-f]{6})$/i.exec(hex);
  if (!m) return true;
  var n = parseInt(m[1], 16);
  var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  var lum = 0.299*r + 0.587*g + 0.114*b;  // 0~255,越大越亮
  return lum > 165;
}

function getColor(task) {
  for (var k in stagePalettes) {
    if (task.indexOf(k) !== -1) {
      return stagePalettes[k][getStageDepth(task)];
    }
  }
  return '#909399';
}

// 返回任务所属类别名(用于图例分组)
function getStageCategory(task) {
  for (var k in stagePalettes) {
    if (task.indexOf(k) !== -1) return k;
  }
  return '其他';
}

var data = null;
var chart;

// v2 缓存策略:
//   DATA_VERSION 变化 = 代码结构升级 → 所有人重置为HTML内嵌数据
//   EMBEDDED_HASH 变化 = HTML内嵌数据变了(即有人上传了新版HTML)→ 老访客打开即自动切换新数据,无需清缓存
var DATA_VERSION = 'v11';
function embeddedHash(d) {
  var str = JSON.stringify(d);
  var h = 5381;
  for (var hi = 0; hi < str.length; hi++) h = ((h << 5) + h + str.charCodeAt(hi)) >>> 0;
  return h.toString(36);
}
var EMBEDDED_HASH = embeddedHash(defaultData);
try {
  var savedVer = localStorage.getItem('gantt_v2_data_version');
  var savedHash = localStorage.getItem('gantt_v2_embedded_hash');
  if (savedVer !== DATA_VERSION || savedHash !== EMBEDDED_HASH) {
    // 检测到新版HTML(代码升级或数据更新)→ 以内嵌数据为准
    data = JSON.parse(JSON.stringify(defaultData));
    localStorage.setItem('gantt_v2_data', JSON.stringify(data));
    localStorage.setItem('gantt_v2_data_version', DATA_VERSION);
    localStorage.setItem('gantt_v2_embedded_hash', EMBEDDED_HASH);
  } else {
    var s = localStorage.getItem('gantt_v2_data');
    data = s ? JSON.parse(s) : JSON.parse(JSON.stringify(defaultData));
  }
  // 数据有效性检查
  if (data.length === 0 || !data[0].start || !data[0].end || isNaN(parseDate(data[0].start))) {
    data = JSON.parse(JSON.stringify(defaultData));
    localStorage.setItem('gantt_v2_data', JSON.stringify(data));
    localStorage.setItem('gantt_v2_embedded_hash', EMBEDDED_HASH);
  }
  // 兜底:progress 允许为 null(= 不画实际条/空白);仅修正非法数字
  for (var i = 0; i < data.length; i++) {
    if (data[i].progress !== null && data[i].progress !== undefined && data[i].progress !== '' && isNaN(data[i].progress)) {
      data[i].progress = null;
    }
    if (data[i].progress === '') data[i].progress = null;
    // 实际日期非法(空串/错误格式)时清空,渲染时回退为计划日期
    if (data[i].actualStart && isNaN(parseDate(data[i].actualStart))) data[i].actualStart = '';
    if (data[i].actualEnd && isNaN(parseDate(data[i].actualEnd))) data[i].actualEnd = '';
  }
} catch(e) { data = JSON.parse(JSON.stringify(defaultData)); }

// 取某任务的实际起止日期;未填或非法时回退到计划日期
function getActualRange(t) {
  var aS = t.actualStart ? parseDate(t.actualStart) : new Date(NaN);
  var aE = t.actualEnd ? parseDate(t.actualEnd) : new Date(NaN);
  if (isNaN(aS)) aS = parseDate(t.start);
  if (isNaN(aE)) aE = parseDate(t.end);
  return { start: aS, end: aE,
           startStr: t.actualStart || t.start,
           endStr: t.actualEnd || t.end };
}

function parseDate(s) {
  if (!s || typeof s !== 'string') return new Date(NaN);
  s = s.trim();
  if (!s) return new Date(NaN);
  var d = new Date(s);
  if (!isNaN(d)) return d;
  d = new Date(s.replace(/-/g, '/'));
  if (!isNaN(d)) return d;
  d = new Date(s.replace(/\./g, '/'));
  if (!isNaN(d)) return d;
  var m = s.match(/(\d{4})[^\d]+(\d{1,2})[^\d]+(\d{1,2})/);
  if (m) {
    d = new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
    if (!isNaN(d)) return d;
  }
  return new Date(NaN);
}

function getStages() {
  var stages = [];
  for (var i = 0; i < data.length; i++)
    if (data[i].task && String(data[i].task).trim() && stages.indexOf(data[i].task) === -1) stages.push(data[i].task);
  return stages;
}

function renderTable() {

      '<td><input value="' + (r.end||'') + '" onchange="data['+i+'].end=this.value;save()"></td>' +

      '<td><input value="' + (r.actualEnd||'') + '" placeholder="同计划" onchange="data['+i+'].actualEnd=this.value.trim();save();refreshChart()"></td>' +
      '<td><input class="progress-input" type="number" min="0" max="100" value="' + p + '" onchange="data['+i+'].progress=Math.max(0,Math.min(100,parseInt(this.value)||0));save();refreshChart()"></td>' +
      '<td class="del-btn" onclick="delRow('+i+')">✕</td></tr>';
  }
}

function exportCSV() {
  // 双行格式:每个任务两行(计划行 + 实际行),实际可单独填与计划不同的起止日期
  var csv = '\ufeff资源,类型,任务,开始,结束,进度\n';
  for (var i = 0; i < data.length; i++) {
    var r = data[i];
    var p = (r.progress != null && r.progress !== '' && !isNaN(r.progress)) ? r.progress : '';
    csv += r.resource + ',计划,' + r.task + ',' + r.start + ',' + r.end + ',\n';
    csv += r.resource + ',实际,' + r.task + ',' + (r.actualStart || r.start) + ',' + (r.actualEnd || r.end) + ',' + p + '\n';
  }
  var blob = new Blob([csv], {type:'text/csv'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'gantt_v2_data.csv'; a.click();
}

function importCSV(e) {
  var f = e.target.files[0]; if (!f) return;
  var readAs = function(enc, cb) {
    var r = new FileReader();
    r.onload = function() { cb(r.result); };
    r.readAsText(f, enc);
  };
  readAs('UTF-8', function(text) {
    if (text.indexOf('\ufffd') !== -1) {
      readAs('GBK', parseAndApplyCSV);
    } else {
      parseAndApplyCSV(text);
    }
  });
  e.target.value = '';
}

function normDateStr(s) {
  return (s || '').replace(/\//g, '-').replace(/年|月/g, '-').replace(/日/g, '').trim();
}

function parseAndApplyCSV(text) {
  var lines = text.trim().split(/\r?\n/).filter(function(l){ return l.trim(); });
  if (lines.length < 2) { alert('文件为空或只有表头,共识别到 ' + lines.length + ' 行'); return; }
  var header = lines[0];
  var delim = ',';
  if ((header.match(/;/g) || []).length > (header.match(/,/g) || []).length) delim = ';';
  if ((header.match(/\t/g) || []).length > (header.match(delim === ',' ? /,/g : delim === ';' ? /;/g : /\t/g) || []).length) delim = '\t';
  var cols = header.split(delim).map(function(s){ return s.trim().replace(/^\ufeff/, ''); });

  // 列识别:先精确识别"实际/计划/类型",再做通用兜底
  var idx = { resource: -1, task: -1, type: -1,
              planStart: -1, planEnd: -1, actualStart: -1, actualEnd: -1, progress: -1 };
  function findCol(re) { for (var i = 0; i < cols.length; i++) if (re.test(cols[i])) return i; return -1; }
  idx.resource = findCol(/资源|产品机型|机型|resource/i);
  idx.task = findCol(/任务|阶段|task/i);
  idx.type = findCol(/类型|type/i);
  idx.actualStart = findCol(/实际开始|actual\s*start/i);
  idx.actualEnd = findCol(/实际结束|actual\s*end/i);
  idx.planStart = findCol(/计划开始|plan\s*start/i);
  idx.planEnd = findCol(/计划结束|plan\s*end/i);
  if (idx.planStart < 0) idx.planStart = findCol(/开始|start/i);  // 无"实际开始"列时命中唯一的开始列
  if (idx.planEnd < 0) idx.planEnd = findCol(/结束|end/i);
  idx.progress = findCol(/进度|progress/i);

  // 行数据
  var rows = [];
  for (var i = 1; i < lines.length; i++) {
    rows.push(lines[i].split(delim).map(function(s){ return s.trim(); }));
  }

  var newData = [];
  var keyMap = {};  // "资源||任务" → newData 索引(用于双行格式配对)

  function ensureEntry(res, task) {
    var key = res + '||' + task;
    if (keyMap[key] != null) return keyMap[key];
    var e = { resource: res, task: task, start: '', end: '', progress: null };
    newData.push(e); keyMap[key] = newData.length - 1;
    return newData.length - 1;
  }

  if (idx.type >= 0) {
    // === 模式A:双行格式(类型=计划/实际)===
    for (var i = 0; i < rows.length; i++) {
      var p = rows[i];
      var res = p[idx.resource] || '';
      var task = p[idx.task] || '';
      if (!res || !task) continue;
      var isActual = /实|actual/i.test(p[idx.type] || '');
      // 双行格式里开始/结束列是共用的(计划行=计划日期,实际行=实际日期)
      var dS = normDateStr(idx.planStart >= 0 ? p[idx.planStart] : '');
      var dE = normDateStr(idx.planEnd >= 0 ? p[idx.planEnd] : '');
      var progRaw = ((idx.progress >= 0 && p[idx.progress]) ? p[idx.progress] : '').trim();
      var prog = parseInt(progRaw, 10);
      var ei = ensureEntry(res, task);
      if (isActual) {
        newData[ei].actualStart = dS;
        newData[ei].actualEnd = dE;
        // 进度列留空 → null(条照画但不标百分比);有数字 → 标注
        newData[ei].progress = isNaN(prog) ? null : Math.max(0, Math.min(100, prog));
      } else {
        newData[ei].start = dS;
        newData[ei].end = dE;
      }
    }
  } else {
    // === 模式B:宽表(实际开始/实际结束独立列) 或 模式C:旧5列格式 ===
    if (idx.resource < 0) idx.resource = 0;
    if (idx.task < 0) idx.task = 1;
    if (idx.planStart < 0) idx.planStart = 2;
    if (idx.planEnd < 0) idx.planEnd = 3;
    if (idx.progress < 0 && idx.actualStart < 0) idx.progress = 4;
    for (var i = 0; i < rows.length; i++) {
      var p = rows[i];
      var res = p[idx.resource] || '';
      var task = p[idx.task] || '';
      var dS = normDateStr(p[idx.planStart] || '');
      var dE = normDateStr(p[idx.planEnd] || '');
      if (!res || !dS || !dE) continue;
      var e = { resource: res, task: task, start: dS, end: dE, progress: null };
      if (idx.actualStart >= 0 && p[idx.actualStart]) e.actualStart = normDateStr(p[idx.actualStart]);
      if (idx.actualEnd >= 0 && p[idx.actualEnd]) e.actualEnd = normDateStr(p[idx.actualEnd]);
      if (idx.progress >= 0) {
        var prog = parseInt((p[idx.progress] || '').trim(), 10);
        if (!isNaN(prog)) e.progress = Math.max(0, Math.min(100, prog));
      }
      newData.push(e);
    }
  }

  // 清理:计划日期缺失的行(只有实际行没计划行)用实际日期兜底
  for (var i = 0; i < newData.length; i++) {
    var e = newData[i];
    if (!e.start && e.actualStart) e.start = e.actualStart;
    if (!e.end && e.actualEnd) e.end = e.actualEnd;
    // 实际日期若与计划完全相同则清空,避免冗余
    if (e.actualStart === e.start && e.actualEnd === e.end) { e.actualStart = ''; e.actualEnd = ''; }
  }
  newData = newData.filter(function(e){ return e.resource && e.start && e.end; });
  // 已移除的类别(热虹吸)不再展示,即使旧CSV里带有也过滤掉
  newData = newData.filter(function(e){ return e.task.indexOf('热虹吸') === -1; });

  if (newData.length > 0) {
    data = newData; save(); renderTable(); refreshChart();
    var cnt = (function(){ var r=[]; for(var i=0;i<data.length;i++) if(r.indexOf(data[i].resource)<0) r.push(data[i].resource); return r.length; })();
    var diffCnt = 0; for (var i = 0; i < data.length; i++) if (data[i].actualStart || data[i].actualEnd) diffCnt++;
    alert('✓ 已导入 ' + newData.length + ' 条数据,' + cnt + ' 个机型' + (diffCnt ? ',其中 ' + diffCnt + ' 条实际日期与计划不同' : ''));
  } else {
    alert('✗ 未识别到有效数据行！\n表头: ' + lines[0] + '\n支持3种格式:\n① 资源,类型,任务,开始,结束,进度(类型=计划/实际)\n② 资源,任务,计划开始,计划结束,实际开始,实际结束,进度\n③ 旧版:资源,任务,开始,结束,进度');
  }
}

  var blob = new Blob([html], {type: 'text/html;charset=utf-8'});

function importHTML(e) {

  var r = new FileReader();
  r.onload = function() {
    try {
      var match = r.result.match(/var defaultData = (\[[\s\S]*?\]);/);

        // progress 留空(null)合法:条照画、不标百分比

          if (data[i].progress === '') data[i].progress = null;
        }
        save(); renderTable(); refreshChart(); alert('导入成功！');
      }
    } catch(err) { alert('导入失败: ' + err.message); }
  };

// ===== 图表 =====
function refreshChart() {
  if (typeof echarts === 'undefined') {
    document.getElementById('err').style.display = 'block';
    document.getElementById('err').textContent = 'ECharts 未加载！';
    return;
  }
  document.getElementById('err').style.display = 'none';

  var stages = getStages();
  var resources = [];
  for (var i = 0; i < data.length; i++)
    if (resources.indexOf(data[i].resource) === -1) resources.push(data[i].resource);
  resources.reverse();

  // yCats 精细网格(每格2px):
  // 每机型组 = 计划条20 + 组内缝6 + 实际条20 + 组间缝20 = 66px = 33格
  // 条:组内缝 ≈ 1:0.3
  var UNIT = 2, BAR_U = 10, INNER_GAP_U = 3, GROUP_GAP_U = 10;
  var GROUP_U = BAR_U*2 + INNER_GAP_U + GROUP_GAP_U;  // 33
  var yCats = [];
  for (var i = 0; i < resources.length; i++) {
    for (var u = 0; u < GROUP_U; u++) yCats.push('');
  }

  var globalStart = parseDate(data[0].start);
  var globalEnd = parseDate(data[0].end);
  for (var i = 0; i < data.length; i++) {
    var s = parseDate(data[i].start), e = parseDate(data[i].end);
    if (s < globalStart) globalStart = s;
    if (e > globalEnd) globalEnd = e;
    // 实际起止日期也要纳入全局范围(实际可能早于/晚于计划)
    var ar = getActualRange(data[i]);
    if (ar.start < globalStart) globalStart = ar.start;
    if (ar.end > globalEnd) globalEnd = ar.end;
  }

  var maxDays = Math.round((globalEnd - globalStart) / 86400000) + 1;

  // v2: 每天像素 7px → 可视区约1000px,一屏显示约4个半月(140天+)
  var pxPerDay = 7;
  var chartWidth = Math.max(1400, maxDays * pxPerDay + 180);

  // 每月1号偏移
  var monthDayOffsets = [];
  var cur = new Date(globalStart); cur.setDate(1);
  while (cur <= globalEnd) {
    monthDayOffsets.push(Math.round((cur - globalStart) / 86400000));
    cur.setMonth(cur.getMonth() + 1);
  }
  var markLineData = [];
  for (var mi = 0; mi < monthDayOffsets.length; mi++) {
    markLineData.push({ xAxis: monthDayOffsets[mi] });
  }

  // 当天日期竖线(红色加粗,位置每天自动变化;随横向滚动一起移动)
  var nowD = new Date();
  var today0 = new Date(nowD.getFullYear(), nowD.getMonth(), nowD.getDate());
  var todayOff = Math.round((today0 - globalStart) / 86400000);
  markLineData.push({
    xAxis: todayOff,
    lineStyle: { color: '#F5222D', width: 2, type: 'solid' },
    label: {
      show: true, position: 'start', distance: 8,
      color: '#F5222D', fontSize: 12, fontWeight: 'bold',
      formatter: '今天 ' + (today0.getMonth() + 1) + '/' + today0.getDate()
    }
  });

  // rows[i] = 机型 i 的任务列表(按开始日期排序)
  var rows = [];
  var maxSlots = 0;
  for (var i = 0; i < resources.length; i++) {
    var list = [];
    for (var j = 0; j < data.length; j++) {
      var d = data[j];
      if (d.resource !== resources[i]) continue;
      // 任务留空 / 计划起止日期缺失或非法 → 不进入图表
      if (!d.task || !String(d.task).trim()) continue;
      if (!d.start || !d.end) continue;
      if (isNaN(parseDate(d.start).getTime()) || isNaN(parseDate(d.end).getTime())) continue;
      list.push(d);
    }
    list.sort(function(a, b) { return parseDate(a.start) - parseDate(b.start); });
    rows.push(list);
    if (list.length > maxSlots) maxSlots = list.length;
  }

  var series = [];
  var N = resources.length;
  var TOTAL_ROWS = N * GROUP_U;  // 精细网格行数(每行2px)

  // 动态画布高度:每组固定66px(计划20+缝6+实际20+组间20)
  var GRID_TOP = 30, GRID_BOTTOM = 25;
  var chartH = GRID_TOP + TOTAL_ROWS * UNIT + GRID_BOTTOM;
  document.getElementById('chart').style.height = chartH + 'px';
  document.getElementById('chartWrap').style.height = (chartH + 20) + 'px';

  // 计划/实际各一个累计位置
  var posPlan = [];   for (var i = 0; i < N; i++) posPlan.push(0);
  var posActual = []; for (var i = 0; i < N; i++) posActual.push(0);

  for (var k = 0; k < maxSlots; k++) {
    var planOff = new Array(TOTAL_ROWS).fill(0);
    var planDurItems = new Array(TOTAL_ROWS).fill(null);

    var actualOff = new Array(TOTAL_ROWS).fill(0);
    var actualDurItems = new Array(TOTAL_ROWS).fill(null);
    var actualProgressArr = new Array(TOTAL_ROWS).fill(null);
    var actualTasks = new Array(TOTAL_ROWS).fill(null);
    // 仅在条的中间行显示百分比(避免10行重复文字)
    var labelBand = {};

    for (var i = 0; i < N; i++) {
      var t = rows[i][k] || null;
      var planBase = i*GROUP_U;              // 计划条起始网格行
      var actualBase = i*GROUP_U + BAR_U + INNER_GAP_U;  // 实际条起始网格行(偏移13格=26px)

      if (t) {
        var startOff = Math.round((parseDate(t.start) - globalStart) / 86400000);
        var dur = Math.round((parseDate(t.end) - parseDate(t.start)) / 86400000) + 1;
        if (dur <= 0) dur = 0;
        var planHidden = startOff - posPlan[i];
        if (planHidden < 0) planHidden = 0;

        // 画实际条只看实际起止日期(有日期就画);进度列仅控制是否标百分比
        var hasLabel = (t.progress !== null && t.progress !== undefined && t.progress !== '' && !isNaN(t.progress));
        var progress = hasLabel ? Math.max(0, Math.min(100, parseInt(t.progress, 10))) : null;
        var ar = getActualRange(t);
        var actStartOff = Math.round((ar.start - globalStart) / 86400000);
        var actDur = Math.round((ar.end - ar.start) / 86400000) + 1;
        if (actDur <= 0) actDur = 0;
        var actHidden = actStartOff - posActual[i];
        if (actHidden < 0) actHidden = 0;

        var planColor = getColor(t.task);

        // 计划条
        for (var j = 0; j < BAR_U; j++) {
          var pr = planBase + j;
          planOff[pr] = planHidden;
          planDurItems[pr] = { value: dur, itemStyle: { color: planColor } };
        }

        // 实际条:进度为有效数字且 >0 才画;进度=0 或留空(null) → 整块不画(未开始,不留0%)
        var drawActual = (progress !== null && progress > 0);
        for (var j = 0; j < BAR_U; j++) {
          var rr = actualBase + j;
          actualOff[rr] = actHidden;
          if (actDur > 0 && drawActual) {
            var txtColor = isLightColor(planColor) ? '#333' : '#fff';
            actualDurItems[rr] = { value: actDur, itemStyle: { color: planColor }, label: { color: txtColor } };
            actualProgressArr[rr] = progress;
            actualTasks[rr] = t;
          }
        }
        if (drawActual) labelBand[actualBase + Math.floor(BAR_U/2)] = true;

        posPlan[i] += planHidden + dur;
        posActual[i] += actHidden + actDur;
      }
    }

    // 计划 offset series(透明)
    series.push({
      name: '_pOff' + k, type: 'bar', stack: 'planTotal', data: planOff,
      itemStyle: { color: 'transparent', borderColor: 'transparent' },
      label: { show: false }, barCategoryGap: '0%', silent: true, tooltip: { show: false }
    });

    // 计划 visible series(彩色,无文字)
    var planCfg = {
      name: 'planSlot' + k, type: 'bar', stack: 'planTotal', data: planDurItems,
      label: { show: false },
      barCategoryGap: '0%'   // 计划柱与正下方实际柱紧贴(0间距),组间靠空白槽位分隔
    };
    if (k === 0) {
      planCfg.markLine = {
        silent: true, symbol: 'none',
        lineStyle: { color: '#e8e8e8', type: 'solid', width: 1 },
        label: {
          show: true, position: 'start', distance: 8,
          color: '#333', fontSize: 13,
          formatter: function(params) {
            var d = new Date(globalStart.getTime() + params.value * 86400000);
            return d.getFullYear() + '年' + (d.getMonth() + 1) + '月';
          }
        },
        data: markLineData
      };
    }
    series.push(planCfg);

    // 实际 offset series(透明)
    series.push({
      name: '_aOff' + k, type: 'bar', stack: 'actualTotal', data: actualOff,
      itemStyle: { color: 'transparent', borderColor: 'transparent' },
      label: { show: false }, barCategoryGap: '0%', silent: true, tooltip: { show: false }
    });

    // 实际 visible series(同色=已完成部分,带百分比;未完成留空)
    series.push({
      name: 'actualSlot' + k, type: 'bar', stack: 'actualTotal', data: actualDurItems,
      label: {
        show: true, position: 'inside',
        formatter: (function(arr, bands) {
          return function(params) {
            if (!bands[params.dataIndex]) return '';  // 仅中间行显示一次
            var v = arr[params.dataIndex];
            return (v !== null && v !== undefined) ? (v + '%') : '';  // 空=不标百分比
          };
        })(actualProgressArr, labelBand),
        fontSize: 11, fontWeight: 'bold'
      },
      barCategoryGap: '0%'
    });
  }

  document.getElementById('chart').style.width = chartWidth + 'px';

  if (!chart) chart = echarts.init(document.getElementById('chart'));
  chart.clear();

  chart.setOption({
    tooltip: {
      trigger: 'item',
      formatter: function(p) {
        // 只显示鼠标悬停的那一根条:当前机型 + 当前阶段 的计划或实际
        var name = p.seriesName || '';
        var isActual = name.indexOf('actualSlot') === 0;
        var isPlan = name.indexOf('planSlot') === 0;
        if (!isActual && !isPlan) return '';
        var slotK = parseInt(name.replace(isActual ? 'actualSlot' : 'planSlot', ''), 10);
        var resIdx = Math.floor(p.dataIndex / GROUP_U);
        var t = (rows[resIdx] || [])[slotK];
        if (!t) return '';
        var res = resources[resIdx];
        var html = '<b>' + res + '</b><br/>' + p.marker + ' ' + t.task + '<br/>';
        if (isPlan) {
          var planDurDays = Math.round((parseDate(t.end) - parseDate(t.start)) / 86400000) + 1;
          html += '计划：' + t.start + ' ~ ' + t.end + ' (' + planDurDays + '天)';
        } else {
          var ar2 = getActualRange(t);
          html += '实际：' + ar2.startStr + ' ~ ' + ar2.endStr;
          if (t.progress !== null && t.progress !== undefined && t.progress !== '' && !isNaN(t.progress)) {
            html += '，完成 ' + t.progress + '%';
          }
        }
        return html;
      }
    },
    legend: { show: false },
    grid: { left: 5, right: 30, top: 30, bottom: 25, containLabel: false },
    xAxis: {
      type: 'value', min: 0, max: maxDays,
      axisLine: { show: true, lineStyle: { color: '#999', width: 1.5 } },
      axisLabel: { show: false }, axisTick: { show: false },
      splitLine: { show: false }
    },
    yAxis: {
      type: 'category', data: yCats, inverse: true,
      axisLabel: { show: false },
      axisLine: { show: false }, axisTick: { show: false },
      splitLine: { show: false }
    },
    series: series
  });

  chart.resize();
  renderYLabels(resources);
  renderLegend(stages);

  // 打开/刷新后自动横向滚动,使"今天"竖线位于可视区左1/3处
  try {
    var wrapEl = document.getElementById('chartWrap');
    var clampOff = Math.max(0, Math.min(maxDays, todayOff));
    var pxToday = chart.convertToPixel({ xAxisIndex: 0 }, clampOff);
    if (pxToday != null) {
      wrapEl.scrollLeft = Math.max(0, pxToday - wrapEl.clientWidth / 3);
    }
  } catch(eScroll) {}
}

// 渲染固定左侧Y轴标签(HTML层,滚动时不动)
function renderYLabels(resources) {
  var box = document.getElementById('yLabels');
  box.innerHTML = '';

  // 与 refreshChart 一致的像素布局:每组66px(计划20+组内缝6+实际20+组间20)
  var GRID_TOP = 30;
  var BAR_H = 20, INNER_GAP = 6, GROUP_GAP = 20;
  var GROUP_H = BAR_H*2 + INNER_GAP + GROUP_GAP;  // 66
  var CHART_H = GRID_TOP + resources.length * GROUP_H + 25;

  box.style.top = '20px';
  box.style.left = '20px';
  box.style.width = '125px';
  box.style.height = CHART_H + 'px';
  box.style.display = 'block';

  for (var i = 0; i < resources.length; i++) {
    var base = GRID_TOP + i * GROUP_H;

    // 计划行(机型名,与20px高计划条垂直居中)
    var planRow = document.createElement('div');
    planRow.className = 'y-label-row';
    planRow.textContent = resources[i];
    planRow.style.position = 'absolute';
    planRow.style.left = '0'; planRow.style.right = '0';
    planRow.style.height = BAR_H + 'px';
    planRow.style.top = base + 'px';
    planRow.style.fontWeight = 'bold';
    box.appendChild(planRow);

    // 实际行(与计划条间隔6px)
    var actualRow = document.createElement('div');
    actualRow.className = 'y-label-row y-label-actual';
    actualRow.textContent = '实际';
    actualRow.style.position = 'absolute';
    actualRow.style.left = '0'; actualRow.style.right = '0';
    actualRow.style.height = BAR_H + 'px';
    actualRow.style.top = (base + BAR_H + INNER_GAP) + 'px';
    box.appendChild(actualRow);
  }
}

// v2 图例:按类别分组,每组4级深浅
function renderLegend(stages) {
  var box = document.getElementById('legendBox');
  box.innerHTML = '';

  // 收集出现的所有类别
  var cats = [];
  for (var i = 0; i < stages.length; i++) {
    var c = getStageCategory(stages[i]);
    if (cats.indexOf(c) === -1) cats.push(c);
  }

  // 步骤名(从浅到深)
  var stepNames = ['首台装配完成', '测试完成', '测试问题闭环', '归档完成/发布提单'];

  // 各类别配色组(深浅即步骤,无需单独灰阶说明)
  for (var ci = 0; ci < cats.length; ci++) {
    var cat = cats[ci];
    var palette = stagePalettes[cat] || ['#909399','#A0A0A0','#B0B0B0','#C0C0C0'];
    var grp = document.createElement('div');
    grp.className = 'legend-group';
    grp.innerHTML = '<div class="legend-group-title">' + cat + '</div>';
    for (var d = 0; d < 4; d++) {
      var row = document.createElement('div');
      row.className = 'legend-depth-row';
      row.innerHTML = '<span class="legend-depth-swatch" style="background:' + palette[d] + '"></span>' +
        '<span>' + stepNames[d] + '</span>';
      grp.appendChild(row);
    }
    box.appendChild(grp);
  }
}

window.addEventListener('resize', function() { if (chart) chart.resize(); });

refreshChart();
</script>
