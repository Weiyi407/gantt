<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
/* ===== 钉钉等内嵌浏览器缓存自救 =====
 * 现象:普通浏览器已更新,但钉钉里悬停提示/样式仍是旧的(整个旧HTML被缓存)。
 * 机制:页面打开后以 no-store 方式拉取服务器最新HTML,比对 BUILD_ID,
 *       发现新版就自动跳转到带 ?build=新号 的URL(缓存键不同,强制加载新版)。
 * 用法:每次「导出HTML并上传GitHub」前,把 BUILD_ID 改成新值(建议 当天日期+序号)。 */
var BUILD_ID = '20261021v2';
(function () {
  try {
    var DONE_KEY = 'gantt_build_done';
    var q = new URLSearchParams(location.search);
    // 已经在新版URL上:记录并跳过检查
    if (q.get('build') === BUILD_ID) { sessionStorage.setItem(DONE_KEY, BUILD_ID); return; }
    fetch(location.pathname + '?_vchk=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (html) {
        var m = html.match(/var BUILD_ID = '([^']+)'/);
        var sid = m ? m[1] : '';
        if (sid && sid !== BUILD_ID && sessionStorage.getItem(DONE_KEY) !== sid) {
          sessionStorage.setItem(DONE_KEY, sid);
          location.replace(location.pathname + '?build=' + sid);  // 新URL=新缓存键
        }
      })
      .catch(function () {});   // file://本地预览或网络失败时静默跳过
  } catch (e) {}
  // 右下角极小版本标记,用于肉眼确认钉钉里跑的是不是最新版
  document.addEventListener('DOMContentLoaded', function () {
    var t = document.createElement('div');
    t.textContent = 'v' + BUILD_ID;
    t.style.cssText = 'position:fixed;right:6px;bottom:3px;font-size:10px;color:#c8c9cc;z-index:99999;pointer-events:none;';
    document.body.appendChild(t);
  });
})();
</script>

<style>

  /* 自定义原生滚动条样式 */

  /* ===== 改进表(与甘特图完全独立) ===== */
  #improveTableWrap {

  .back-link:hover { color: #185FA5; text-decoration: underline; }
  .crumb-sep { color: #dcdfe6; margin: 0 10px; font-size: 14px; }

  /* ===== v6: 升级点矩阵表格 ===== */
  .matrix-title { font-size: 15px; font-weight: bold; color: #303133; margin-bottom: 10px; padding-left: 4px; border-left: 4px solid #1F78B4; padding-left: 10px; }
  .upgrade-matrix { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .upgrade-matrix thead th { background: linear-gradient(180deg,#f7f9fc,#eef2f7); color: #303133; font-weight: 600; padding: 10px 12px; text-align: left; border-bottom: 2px solid #dcdfe6; }
  .upgrade-matrix tbody td { padding: 9px 12px; border-bottom: 1px solid #ebeef5; vertical-align: middle; }
  .upgrade-matrix tbody tr:nth-child(even) td { background: #fafbfc; }
  .upgrade-matrix tbody tr:hover td { background: #ecf5ff; }
  .matrix-machine { font-weight: 600; color: #303133; background: #f5f7fa !important; border-right: 1px solid #ebeef5; white-space: nowrap; }
  .matrix-stage { text-align: center; }
  .matrix-upgrade { color: #606266; line-height: 1.5; }

  /* ===== 表达优化: 图注 / 机型链接 / 计划·实际行标签 ===== */
  .chart-note { font-size: 12px; color: #909399; text-align: center; margin: -8px 0 14px; line-height: 1.6; }
  .machine-link {
    cursor: pointer; text-decoration: none; color: #1F78B4;
    border-bottom: 1px dashed #1F78B4; padding: 1px 4px; border-radius: 3px;
    transition: background .15s, color .15s;
  }
  .machine-link:hover { color: #B37508; background: #FFF7E6; border-bottom-color: #B37508; }
  .ml-arrow { font-size: 10px; margin-right: 3px; opacity: .8; }
  .row-tag {
    font-size: 11px; color: #909399; font-weight: 400; margin-left: 6px;
    background: #f5f7fa; border: 1px solid #ebeef5; border-radius: 3px; padding: 0 5px;
  }
  /* ===== v19 风险看板 + 检索筛选栏 ===== */
  .risk-board { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0 2px; }
  /* v20 卡片改版: 左侧色条 + 横排「数字 + 标签」, 零值置灰降噪 */
  .risk-card { position: relative; display: flex; align-items: center; gap: 12px;
               border-radius: 8px; padding: 10px 20px 10px 16px; cursor: pointer;
               background: #fff; border: 1px solid #ebeef5;
               transition: box-shadow .15s ease, transform .15s ease; }
  .risk-card::before { content: ''; position: absolute; left: 0; top: 9px; bottom: 9px;
                       width: 4px; border-radius: 0 3px 3px 0; }
  .risk-card:hover { border-color: #c0c4cc; box-shadow: 0 2px 10px rgba(0,0,0,.08); transform: translateY(-1px); }
  .risk-card.rc-open { border-color: #409EFF; box-shadow: 0 2px 10px rgba(64,158,255,.28); }
  .risk-card.rc-open::before { background: #409EFF !important; }
  .risk-card .rc-num { font-size: 22px; font-weight: 700; line-height: 1; }
  .risk-card .rc-label { font-size: 12px; color: #909399; }
  /* v20: 可点击暗示 —— 右侧箭头, 展开时旋转 90° */
  .risk-card .rc-arrow { font-size: 10px; color: #c0c4cc; transition: transform .15s ease; }
  .risk-card:hover .rc-arrow { color: #909399; }
  .risk-card.rc-open .rc-arrow { color: #409EFF; transform: rotate(90deg); }
  .risk-card.rc-delay::before { background: #F5222D; }
  .risk-card.rc-delay .rc-num { color: #F5222D; }
  .risk-card.rc-due::before { background: #E69508; }
  .risk-card.rc-due .rc-num { color: #E69508; }
  .risk-card.rc-stale::before { background: #B45309; }
  .risk-card.rc-stale .rc-num { color: #B45309; }
  /* 数量为 0: 色条与数字都置灰, 有风险才「亮灯」 */
  .risk-card.rc-zero::before { background: #dcdfe6 !important; }
  .risk-card.rc-zero .rc-num { color: #c0c4cc; }
  .risk-detail { display: none; margin: 6px 0 8px; padding: 8px 10px; border: 1px dashed #ebeef5;
                 border-radius: 8px; background: #fafbfc; font-size: 12px; line-height: 1.8; }
  .risk-chip { display: inline-block; margin: 3px 6px 3px 0; padding: 2px 9px; border-radius: 12px;
               background: #f0f2f5; color: #303133; cursor: pointer; }
  .risk-chip:hover { background: #E6F1FB; color: #185FA5; }
  /* v20 顶部一行: 左看板 + 右工具区; 放不下时自动换行 */
  .top-row { display: flex; align-items: flex-end; justify-content: space-between;
             gap: 16px; flex-wrap: wrap; margin: 4px 0 16px; }
  .risk-board { display: flex; gap: 12px; flex-wrap: wrap; }
  .filter-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  /* v20 搜索组: 输入框 + 放大镜图标按钮拼成一条搜索栏(点图标或回车才搜索) */
  .search-group { display: flex; }
  .search-group .f-search { width: 230px; border-radius: 4px 0 0 4px; }
  .search-btn { display: flex; align-items: center; justify-content: center;
                padding: 0 11px; height: 30px; border: 1px solid #dcdfe6; border-left: none;
                background: #fff; color: #606266; border-radius: 0 4px 4px 0; cursor: pointer; }
  .search-btn:hover { color: #409EFF; background: #F0F7FF; }
  .f-search { padding: 5px 10px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 13px; height: 30px; box-sizing: border-box; }
  .f-sel { padding: 5px 8px; height: 30px; box-sizing: border-box; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 13px; background: #fff; }
  .f-info { font-size: 12px; color: #909399; }
</style>

<body>
<div class="container">
  <h1>PCS产品规划里程碑</h1>

  <div class="tabs" id="tabs">
    <div class="tab active" data-mode="overview">📊 全局概览</div>
    <div class="tab" data-mode="d2500">2500KW详情</div>
    <div class="tab" data-mode="d3450">3450KW详情</div>
  </div>

  <div id="pageTitle" class="page-title" style="display: none;"></div>

  <!-- ===== v20: 顶部一行: 左侧风险看板 + 右侧检索筛选(避免右侧大片留白) ===== -->
  <div class="top-row">
    <div id="riskBoard" class="risk-board"><div class="risk-card rc-delay" onclick="toggleRisk('delay')"><div class="rc-num">8</div><div class="rc-label">阶段延期</div><span class="rc-arrow">▸</span></div><div class="risk-card rc-due" onclick="toggleRisk('due')"><div class="rc-num">4</div><div class="rc-label">本周到期</div><span class="rc-arrow">▸</span></div><div class="risk-card rc-stale rc-zero" onclick="toggleRisk('stale')"><div class="rc-num">0</div><div class="rc-label">超30天未闭环</div><span class="rc-arrow">▸</span></div></div>
    <div class="filter-tools">
      <div class="search-group">
        <input id="searchInput" class="f-search" type="text" placeholder="搜索机型 / 阶段 / 里程碑 / 升级点" onkeydown="if(event.key==='Enter')onFilterChange()">
        <button class="search-btn" onclick="onFilterChange()" title="搜索" aria-label="搜索">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
            <line x1="10.6" y1="10.6" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></line>
          </svg>
        </button>
      </div>
      <select id="statusSel" class="f-sel" onchange="onFilterChange()">
        <option value="all">全部阶段</option>
        <option value="delayed">有延期</option>
        <option value="due">本周到期</option>
        <option value="stale">超30天未闭环</option>
        <option value="wip">进行中</option>
        <option value="done">已闭环阶段</option>
      </select>
      <select id="sortSel" class="f-sel" onchange="onFilterChange()">
        <option value="risk">排序：风险优先（延期↓）</option>
        <option value="planEnd">排序：计划结束↑</option>
        <option value="progress">排序：进度↑</option>
        <option value="default">排序：默认</option>
      </select>
      <span id="filterInfo" class="f-info">显示 7 / 7 个机型</span>
    </div>
  </div>
  <div id="riskDetail" class="risk-detail" style="display: none;"></div>

  <div class="chart-box" style="position:relative">
    <div id="yLabels" style="top: 20px; left: 20px; width: 172px; height: 683px; display: block;"></div>
    <div id="chartWrap" style="height: 703px; margin-left: 195px;">
      <div id="chart" style=""></div>
    </div>
    <div id="legendBox"></div>
    <div id="err" style="display: none;"></div>
  </div>

  <div id="upgradeMatrix" style="margin-top: 18px;"></div>

  <!-- ===== 工具栏 ===== -->
  <div class="toolbar" style="margin-top:12px;">
    <button class="success" onclick="exportHTML()">📦 导出 HTML</button>
    <button onclick="document.getElementById('csvInput').click()">📥 导入 CSV</button>
    <input type="file" id="csvInput" accept=".csv" style="display:none" onchange="importCSV(event)">
    <button onclick="exportCSV()">📊 导出 CSV</button>
    <button onclick="exportPNG()">🖼 导出 PNG</button>
  </div>
</div>

<script>
window.onerror = function(msg) {
  var e = document.getElementById('err'); e.style.display = 'block';
  e.textContent = 'JS错误: ' + msg;

  for (var i = 0; i < data.length; i++) {
    if (data[i].progress !== null && data[i].progress !== undefined && data[i].progress !== '' && isNaN(data[i].progress)) {
      data[i].progress = null;
    }
    if (data[i].progress === '') data[i].progress = null;
    // 实际日期非法(空串/错误格式)时清空,渲染时回退为计划日期
    if (data[i].actualStart && isNaN(parseDate(data[i].actualStart))) data[i].actualStart = '';
    if (data[i].actualEnd && isNaN(parseDate(data[i].actualEnd))) data[i].actualEnd = '';
  }
} catch(e) { data = JSON.parse(JSON.stringify(defaultData)); }

// 取某任务的实际起止日期;未填或非法时回退到计划日期
function getActualRange(t) {
  var aS = t.actualStart ? parseDate(t.actualStart) : new Date(NaN);
  var aE = t.actualEnd ? parseDate(t.actualEnd) : new Date(NaN);
  if (isNaN(aS)) aS = parseDate(t.start);
  if (isNaN(aE)) aE = parseDate(t.end);
  return { start: aS, end: aE,
           startStr: t.actualStart || t.start,
           endStr: t.actualEnd || t.end };
}

function parseDate(s) {
  if (!s || typeof s !== 'string') return new Date(NaN);
  s = s.trim();
  if (!s) return new Date(NaN);
  // 缺少年份的日期(如 "10-23", "10/23", "10月23日") → 用当前年份补齐
  // 必须在 new Date() 之前处理,因为 new Date("10/23") 会被解析成 2001 年
  if (!/\d{4}/.test(s)) {
    var m = s.match(/(\d{1,2})[^\d]+(\d{1,2})/);
    if (m) {
      var nowY = new Date().getFullYear();
      var d = new Date(nowY, parseInt(m[1])-1, parseInt(m[2]));
      if (!isNaN(d)) return d;
    }
  }
  var d = new Date(s);
  if (!isNaN(d)) return d;
  d = new Date(s.replace(/-/g, '/'));
  if (!isNaN(d)) return d;
  d = new Date(s.replace(/\./g, '/'));
  if (!isNaN(d)) return d;
  var m2 = s.match(/(\d{4})[^\d]+(\d{1,2})[^\d]+(\d{1,2})/);
  if (m2) {
    d = new Date(parseInt(m2[1]), parseInt(m2[2])-1, parseInt(m2[3]));
    if (!isNaN(d)) return d;
  }
  return new Date(NaN);
}

// ===== 延期判定 =====
// 规则1:实际结束日期(actualEnd)比计划结束日期(end)晚 >= 7 天 → 延期(已完工但晚了)
// 规则2:今天已超过计划结束 + 7 天,且进度 < 100% → 延期(逾期未完成)
var DELAY_THRESHOLD_DAYS = 7;
function getDelayDays(t) {
  // 规则1的延期天数:实际结束 - 计划结束
  if (!t || !t.actualEnd || !t.end) return 0;
  var planEnd = parseDate(t.end);
  var actualEnd = parseDate(t.actualEnd);
  if (isNaN(planEnd) || isNaN(actualEnd)) return 0;
  return Math.round((actualEnd - planEnd) / 86400000);
}
function getOverdueDays(t) {
  // 规则2的逾期天数:今天 - 计划结束
  if (!t || !t.end) return 0;
  var planEnd = parseDate(t.end);
  if (isNaN(planEnd)) return 0;
  var now = new Date();
  var today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((today0 - planEnd) / 86400000);
}
function getProgNum(t) {
  if (!t) return 0;
  if (t.progress === null || t.progress === undefined || t.progress === '' || isNaN(t.progress)) return 0;
  return Number(t.progress);
}
function isDelayed(t) {
  if (!t) return false;
  if (getDelayDays(t) >= DELAY_THRESHOLD_DAYS) return true;                    // 规则1
  if (getOverdueDays(t) >= DELAY_THRESHOLD_DAYS && getProgNum(t) < 100) return true;  // 规则2
  return false;
}
// v19: 提前天数 = 计划结束 - 实际结束(正数=提前完工); 与延期对称, 同样用 7 天阈值避免噪音
function getAheadDays(t) {
  if (!t || !t.actualEnd || !t.end) return 0;
  var planEnd = parseDate(t.end);
  var actualEnd = parseDate(t.actualEnd);
  if (isNaN(planEnd) || isNaN(actualEnd)) return 0;
  return Math.round((planEnd - actualEnd) / 86400000);
}
function isAhead(t) {
  if (!t || isDelayed(t)) return false;
  // 与延期规则1对称: 只要填了实际结束日期即视为完工, 不依赖 progress 字段(避免漏标)
  if (!t.actualEnd) return false;
  return getAheadDays(t) >= DELAY_THRESHOLD_DAYS;
}

function buildStageData(srcData) {

  for (var m = 0; m < machines.length; m++) {
    for (var j = 0; j < srcData.length; j++) {
      var t = srcData[j];
      if (t.resource !== machines[m] || !t.task || !t.start || !t.end) continue;
      if (isNaN(parseDate(t.start).getTime()) || isNaN(parseDate(t.end).getTime())) continue;
      var cat = getStageCategory(t.task, t);

      var g = byCat[cat];

      if (t.progress !== null && t.progress !== undefined && t.progress !== '' && !isNaN(t.progress))

    if (ai === -1 && bi === -1) return 0;
    if (ai === -1) return 1;

    var avg = null;

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function fmtDate(d) {
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
// 概览页条块紧凑日期标签: 同年 "9/1-12/30", 跨年带年份
function shortDateRange(s, e) {
  var ds = parseDate(s), de = parseDate(e);
  if (isNaN(ds.getTime()) || isNaN(de.getTime())) return '';
  function md(d) { return (d.getMonth() + 1) + '/' + d.getDate(); }
  if (ds.getFullYear() === de.getFullYear()) return md(ds) + '-' + md(de);
  return ds.getFullYear() + '/' + md(ds) + '-' + de.getFullYear() + '/' + md(de);
}
// 自动判定生命周期: 已完成(全部100%或已归档100%) / 在研(有进度或有未来计划) / 规划中
function autoLifecycle(tasks) {
  if (!tasks || !tasks.length) return '规划中';
  var n = new Date();
  var today0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  var all100 = true, hasProg = false, hasActive = false, hasFuture = false, arch100 = false;
  for (var i = 0; i < tasks.length; i++) {
    var p = tasks[i].progress;
    p = (p === null || p === undefined || p === '' || isNaN(p)) ? 0 : Number(p);
    if (p < 100) all100 = false;
    if (p > 0) hasProg = true;
    if (p > 0 && p < 100) hasActive = true;
    var tn = tasks[i].task || '';
    if (tn.indexOf('归档') !== -1 && p >= 100) arch100 = true;
    var e = parseDate(tasks[i].end);
    if (!isNaN(e) && e >= today0) hasFuture = true;
  }
  if (arch100 && all100) return '已完成';
  if (all100 && !hasFuture) return '已完成';
  if (hasActive || (hasFuture && hasProg)) return '在研';
  if (hasFuture && !hasProg) return '规划中';
  return '在研';
}
function getLifecycle(name, tasks) {
  var ov = LIFECYCLE_OVERRIDE[name];
  if (ov && ov.status) {
    return { status: ov.status,
             isReplaced: ov.isReplaced !== undefined ? !!ov.isReplaced : (ov.status === '已替代'),
             replacedBy: ov.replacedBy || '' };
  }
  return { status: autoLifecycle(tasks), isReplaced: false, replacedBy: '' };
}
// 按当前明细 data 汇总每个机型的: 大类/状态/计划跨度/实际跨度/整体进度
function computeMachineMeta() {
  var meta = {};
  for (var i = 0; i < data.length; i++) {
    var d = data[i];
    var name = d.resource;
    if (!name) continue;
    if (!meta[name]) meta[name] = { name: name, category: CATEGORY_MAP[name] || '其他',
      tasks: [], planStart: null, planEnd: null, actStart: null, actEnd: null,
      progSum: 0, progCnt: 0 };
    var m = meta[name];
    m.tasks.push(d);
    var s = parseDate(d.start), e = parseDate(d.end);
    if (!isNaN(s) && (m.planStart === null || s < m.planStart)) m.planStart = s;
    if (!isNaN(e) && (m.planEnd === null || e > m.planEnd)) m.planEnd = e;
    if (d.actualStart) { var as = parseDate(d.actualStart);
      if (!isNaN(as) && (m.actStart === null || as < m.actStart)) m.actStart = as; }
    if (d.actualEnd) { var ae = parseDate(d.actualEnd);
      if (!isNaN(ae) && (m.actEnd === null || ae > m.actEnd)) m.actEnd = ae; }
    if (d.progress !== null && d.progress !== undefined && d.progress !== '' && !isNaN(d.progress)) {
      m.progSum += Number(d.progress); m.progCnt++;
    }
  }
  for (var name in meta) {
    var m = meta[name];
    var lc = getLifecycle(name, m.tasks);
    m.status = lc.status; m.isReplaced = lc.isReplaced; m.replacedBy = lc.replacedBy;
    m.progress = m.progCnt ? Math.round(m.progSum / m.progCnt) : 0;
    m.planStart = m.planStart ? fmtDate(m.planStart) : '';
    m.planEnd = m.planEnd ? fmtDate(m.planEnd) : '';
    m.actStart = m.actStart ? fmtDate(m.actStart) : '';
    m.actEnd = m.actEnd ? fmtDate(m.actEnd) : '';
  }
  return meta;
}
// 概览页阶段段块配色: 沿用页下方图例 —— 2500KW=黄色系, 3450KW=蓝色系
// 按阶段状态选深浅: 在研=亮色 / 已完成=深色 / 已替代=灰 / 规划中=浅亮色
// 同机型内相邻两段若同色, 给后者加底纹(decal)区分
function ovSegColor(category, status) {
  if (status === '已替代') return '#B8BCC4';
  if (category === '2500KW') {
    if (status === '已完成') return '#9C6B00';
    if (status === '规划中') return '#F7BE43';
    return '#E69508';
  }
  if (status === '已完成') return '#0B3D63';
  if (status === '规划中') return '#5BA8D6';
  return '#1F78B4';
}
// 某机型某阶段的研发状态: 全部里程碑100%=已完成; 机型被替代=已替代; 有进度=在研; 否则规划中
function ovStageStatus(machine, cat) {
  var ov = LIFECYCLE_OVERRIDE[machine];
  if (ov && (ov.isReplaced || ov.status === '已替代')) return '已替代';
  var ts = [], all100 = true, hasProg = false;
  for (var i = 0; i < data.length; i++) {
    var d = data[i];
    if (d.resource !== machine) continue;
    if (getStageCategory(d.task, d) !== cat) continue;
    ts.push(d);
    var p = getProgNum(d);
    if (p < 100) all100 = false;
    if (p > 0) hasProg = true;
  }
  if (!ts.length) return '规划中';
  if (all100) return '已完成';
  return hasProg ? '在研' : '规划中';
}
// 概览数据: 每个机型按阶段切成若干"段"(资源名不变 → 仍占一行, 每段一个slot)
function buildOverviewData() {
  // 反序喂入(渲染时 resources.reverse() 后 2500KW块在最上方)
  var order = CAT_3450.slice().reverse().concat(CAT_2500.slice().reverse());
  var out = [];
  for (var i = 0; i < order.length; i++) {
    var mname = order[i];
    var list = [];
    for (var j = 0; j < data.length; j++)
      if (data[j].resource === mname && data[j].task && data[j].start && data[j].end) list.push(data[j]);
    if (!list.length) continue;
    // 按阶段分组(保持首现顺序)
    var segIdx = {}, segs = [];
    for (var j = 0; j < list.length; j++) {
      var d = list[j];
      var cat = getStageCategory(d.task, d);
      if (segIdx[cat] == null) { segIdx[cat] = segs.length; segs.push({ cat: cat, tasks: [] }); }
      segs[segIdx[cat]].tasks.push(d);
    }
    var mcat = CATEGORY_MAP[mname] || '3450KW';
    // 第一遍: 算出每段的计划/实际区间
    var validSegs = [];
    for (var s = 0; s < segs.length; s++) {
      var seg = segs[s], ps = null, pe = null, as = null, ae = null;
      for (var q = 0; q < seg.tasks.length; q++) {
        var t = seg.tasks[q];
        var sd = parseDate(t.start), ed = parseDate(t.end);
        if (!isNaN(sd) && (ps === null || sd < ps)) ps = sd;
        if (!isNaN(ed) && (pe === null || ed > pe)) pe = ed;
        if (t.actualStart) { var ad = parseDate(t.actualStart); if (!isNaN(ad) && (as === null || ad < as)) as = ad; }
        if (t.actualEnd) { var ad2 = parseDate(t.actualEnd); if (!isNaN(ad2) && (ae === null || ad2 > ae)) ae = ad2; }
      }
      if (ps === null || pe === null) continue;
      seg._ps = ps; seg._pe = pe; seg._as = as; seg._ae = ae;
      validSegs.push(seg);
    }
    // 第二遍: 按条块起始排序(与渲染slot顺序一致, 起始早的层级高覆盖后面的),
    // 并算每段"可见区"中点作为标签锚点, 避免文字被前面的段块遮住
    validSegs.sort(function(a, b){ return a._ps - b._ps; });
    var lastColor = null, covered = [];
    for (var s = 0; s < validSegs.length; s++) {
      var seg = validSegs[s];
      var st = ovStageStatus(mname, seg.cat);
      var disp = STAGE_DISPLAY[seg.cat] || seg.cat;
      var col = ovSegColor(mcat, st);
      var decal = (col === lastColor);   // 相邻段撞色 → 底纹区分
      lastColor = col;
      // 条块区间 = 实际优先(与渲染一致)
      var bs = (seg._as !== null ? seg._as : seg._ps), be = (seg._ae !== null ? seg._ae : seg._pe);
      var spans = [[bs, be]];
      for (var c = 0; c < covered.length; c++) {
        var cs = covered[c][0], ce = covered[c][1];
        var next = [];
        for (var sp = 0; sp < spans.length; sp++) {
          var a = spans[sp][0], b = spans[sp][1];
          if (ce <= a || cs >= b) { next.push([a, b]); continue; }
          if (a < cs) next.push([a, cs]);
          if (ce < b) next.push([ce, b]);
        }
        spans = next;
      }
      var anchor;
      if (spans.length) {
        var best = spans[0];
        for (var sp2 = 1; sp2 < spans.length; sp2++) if (spans[sp2][1] - spans[sp2][0] > best[1] - best[0]) best = spans[sp2];
        anchor = new Date((best[0].getTime() + best[1].getTime()) / 2);
      } else {
        anchor = new Date((bs.getTime() + be.getTime()) / 2);
      }
      covered.push([bs, be]);
      out.push({
        resource: mname,
        stage: seg.cat,
        task: disp,
        segLabel: disp + ' ' + st,
        start: fmtDate(seg._ps), end: fmtDate(seg._pe),
        actualStart: seg._as === null ? '' : fmtDate(seg._as),
        actualEnd: seg._ae === null ? '' : fmtDate(seg._ae),
        progress: null,
        color: col,
        _decal: decal,
        _labelDate: fmtDate(anchor)
      });
    }
    // 第三遍: 同机型内标签防重叠(日期轴最小间隔, 被完全覆盖的段标签会顺延)
    var lbls = out.slice(out.length - validSegs.length);
    lbls.sort(function(a, b){ return parseDate(a._labelDate) - parseDate(b._labelDate); });
    for (var s3 = 1; s3 < lbls.length; s3++) {
      var prevD = parseDate(lbls[s3-1]._labelDate), curD = parseDate(lbls[s3]._labelDate);
      var needDays = Math.ceil((String(lbls[s3-1].segLabel).length + String(lbls[s3].segLabel).length) * 0.75) + 2;
      var minD = new Date(prevD.getTime() + needDays * 86400000);
      if (curD < minD) lbls[s3]._labelDate = fmtDate(minD);
    }
  }
  return out;
}
// 模式 → 喂给渲染引擎的数据(引擎完全不改, 只换输入)
function getModeData() {
  if (MODE === 'overview') return buildOverviewData();
  if (MODE.indexOf('stage-') === 0) {
    var m = MODE.slice(6);
    var out = [];
    for (var j = 0; j < data.length; j++)
      if (data[j].resource === m) out.push(data[j]);
    return out;
  }
  var order = (MODE === 'd2500') ? CAT_2500 : CAT_3450;
  var rev = order.slice().reverse();  // 渲染时 reverse 后 V1 在最上
  var out = [];
  for (var i = 0; i < rev.length; i++)
    for (var j = 0; j < data.length; j++)
      if (data[j].resource === rev[i]) out.push(data[j]);
  return out;
}

// ===== v19: 阶段粒度风险计算 + 检索/筛选/排序 =====
// 风险项粒度 = (机型 + 阶段), 不是整机也不是单个里程碑
var FILTER_TEXT = '';
var FILTER_STATUS = 'all';
var SORT_KEY = 'risk';
var RISK_OPEN = null;      // 当前展开的风险卡片: 'delay' | 'due' | 'stale' | null
var FILTER_INFO = '';

function _today0() {
  var n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
function _weekRange() {
  var t = _today0();
  var dow = (t.getDay() + 6) % 7;                 // 周一=0
  var mon = new Date(t); mon.setDate(t.getDate() - dow);
  var sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return { s: mon, e: sun };
}

// 每个 (机型 · 阶段) 一个单元, 计算: 计划最后一环日期/延期天数/是否闭环/本周到期/超30天未闭环
function stageUnits() {
  var out = [], map = {};
  if (!data) return out;
  for (var i = 0; i < data.length; i++) {
    var d = data[i];
    if (!d || !d.task || !String(d.task).trim()) continue;
    var cat = getStageCategory(d.task, d);
    var disp = STAGE_DISPLAY[cat] || cat;
    var key = d.resource + '||' + disp;
    if (!map[key]) { map[key] = { resource: d.resource, stage: disp, cat: cat, tasks: [] }; out.push(map[key]); }
    map[key].tasks.push(d);
  }
  var t0 = _today0(), wk = _weekRange();
  for (var ui = 0; ui < out.length; ui++) {
    var u = out[ui], lastEnd = null, maxDelay = 0, maxOverdue = 0, delayed = false, progSum = 0, progCnt = 0, closed = true;
    for (var j = 0; j < u.tasks.length; j++) {
      var t = u.tasks[j];
      var pe = parseDate(t.end);
      if (!isNaN(pe) && (lastEnd === null || pe > lastEnd)) lastEnd = pe;   // 计划最后一环
      if (isDelayed(t)) {
        delayed = true;
        if (getDelayDays(t) > maxDelay) maxDelay = getDelayDays(t);
        if (getOverdueDays(t) > maxOverdue) maxOverdue = getOverdueDays(t);
      }
      if (t.progress !== null && t.progress !== undefined && t.progress !== '' && !isNaN(t.progress)) {
        progSum += Number(t.progress); progCnt++;
      }
      if (getProgNum(t) < 100) closed = false;
    }
    u.planEnd = lastEnd;
    u.delayed = delayed;
    u.maxDelayDays = maxDelay;
    u.maxOverdueDays = maxOverdue;
    u.riskDays = Math.max(maxDelay, maxOverdue);
    u.closed = closed && progCnt > 0;
    u.progress = progCnt ? Math.round(progSum / progCnt) : 0;
    u.dueThisWeek = !!lastEnd && lastEnd >= wk.s && lastEnd <= wk.e;
    u.overdueDays = lastEnd ? Math.round((t0 - lastEnd) / 86400000) : 0;
    u.stale = (!u.closed) && u.overdueDays > 30;
  }
  return out;
}

// 机型级聚合指标(用于排序与状态筛选)
function machineMetrics() {
  var units = stageUnits(), m = {};
  for (var i = 0; i < units.length; i++) {
    var u = units[i];
    if (!m[u.resource]) m[u.resource] = { riskDays: 0, maxDelay: 0, lastPlanEnd: null, progSum: 0, progCnt: 0,
                                          hasDelayed: false, dueWeek: false, stale: false, closed: true, hasClosed: false, units: [] };
    var r = m[u.resource];
    r.units.push(u);
    if (u.riskDays > r.riskDays) r.riskDays = u.riskDays;
    if (u.maxDelayDays > r.maxDelay) r.maxDelay = u.maxDelayDays;
    if (u.planEnd && (!r.lastPlanEnd || u.planEnd > r.lastPlanEnd)) r.lastPlanEnd = u.planEnd;
    if (u.delayed) r.hasDelayed = true;
    if (u.dueThisWeek) r.dueWeek = true;
    if (u.stale) r.stale = true;
    if (!u.closed) r.closed = false;
    if (u.closed) r.hasClosed = true;   // v20: 存在已闭环阶段(整机长期升级, 很少整机全闭环)
    r.progSum += u.progress; r.progCnt++;
  }
  for (var k in m) m[k].progress = m[k].progCnt ? Math.round(m[k].progSum / m[k].progCnt) : 0;
  return m;
}

// 机型是否命中搜索词(机型名 / 阶段 / 里程碑 / 升级点)
function machineMatchesText(res) {
  if (!FILTER_TEXT) return true;
  var q = String(FILTER_TEXT).toLowerCase();
  if (String(res).toLowerCase().indexOf(q) !== -1) return true;
  if (!data) return false;
  for (var i = 0; i < data.length; i++) {
    if (data[i].resource !== res) continue;
    var s = [data[i].task, data[i].stage, data[i].upgrade].join(' ').toLowerCase();
    if (s.indexOf(q) !== -1) return true;
  }
  return false;
}
function unitMatchesText(u) {
  if (!FILTER_TEXT) return true;
  var q = String(FILTER_TEXT).toLowerCase();
  if (String(u.resource).toLowerCase().indexOf(q) !== -1) return true;
  if (String(u.stage).toLowerCase().indexOf(q) !== -1) return true;
  for (var j = 0; j < u.tasks.length; j++) {
    var s = [u.tasks[j].task, u.tasks[j].upgrade].join(' ').toLowerCase();
    if (s.indexOf(q) !== -1) return true;
  }
  return false;
}
function unitMatchStatus(u) {
  if (FILTER_STATUS === 'delayed') return u.delayed;
  if (FILTER_STATUS === 'due') return u.dueThisWeek;
  if (FILTER_STATUS === 'stale') return u.stale;
  if (FILTER_STATUS === 'done') return u.closed;
  if (FILTER_STATUS === 'wip') return (!u.closed) && u.progress > 0;
  return true;
}

// v20e: 按阶段状态过滤任务(与 stageUnits 同一套阶段归类)
function filterTasksByStatus(srcData) {
  var units = stageUnits(), flag = {};
  for (var i = 0; i < units.length; i++) flag[units[i].resource + "||" + units[i].stage] = unitMatchStatus(units[i]);
  var out = [];
  for (var j = 0; j < srcData.length; j++) {
    var d = srcData[j];
    if (!d || !d.task || !String(d.task).trim()) continue;
    var cat = getStageCategory(d.task, d);
    var disp = STAGE_DISPLAY[cat] || cat;
    if (flag[d.resource + '||' + disp]) out.push(d);
  }
  return out;
}

// 机型列表: 先筛选, 再排序(概览页按大类分组内排序, 保证"2500KW/3450KW"分组标题仍正确)
function filterSortMachines(resources) {
  var mets = machineMetrics();
  var total = resources.length;
  var list = [];
  for (var i = 0; i < resources.length; i++) {
    var r = resources[i], m = mets[r] || {};
    if (!machineMatchesText(r)) continue;
    if (FILTER_STATUS === 'delayed' && !m.hasDelayed) continue;
    if (FILTER_STATUS === 'due' && !m.dueWeek) continue;
    if (FILTER_STATUS === 'stale' && !m.stale) continue;
    if (FILTER_STATUS === 'done' && !m.hasClosed) continue;
    if (FILTER_STATUS === 'wip' && !(m.closed === false && m.progress > 0)) continue;
    list.push(r);
  }
  if (SORT_KEY !== 'default') {
    var cmp = function(a, b) {
      var ma = mets[a] || {}, mb = mets[b] || {};
      if (SORT_KEY === 'risk') return (mb.riskDays || 0) - (ma.riskDays || 0);
      if (SORT_KEY === 'planEnd') return (ma.lastPlanEnd ? ma.lastPlanEnd.getTime() : 1e15) - (mb.lastPlanEnd ? mb.lastPlanEnd.getTime() : 1e15);
      if (SORT_KEY === 'progress') return (ma.progress || 0) - (mb.progress || 0);
      return 0;
    };
    if (MODE === 'overview') {
      var g1 = [], g2 = [];
      for (var k = 0; k < list.length; k++) (CATEGORY_MAP[list[k]] === '2500KW' ? g1 : g2).push(list[k]);
      g1.sort(cmp); g2.sort(cmp);
      list = g1.concat(g2);
    } else {
      list.sort(cmp);
    }
  }
  FILTER_INFO = '显示 ' + list.length + ' / ' + total + ' 个机型';
  return list;
}

// 单机型阶段图: 阶段行按搜索/状态过滤(阶段粒度)
function filterStageRows(rows, srcData) {
  var units = stageUnits();
  var byName = {};
  for (var i = 0; i < units.length; i++) byName[units[i].stage] = units[i];
  var out = [];
  for (var j = 0; j < rows.length; j++) {
    var u = byName[rows[j]];
    if (u && !unitMatchesText(u)) continue;
    if (u && !unitMatchStatus(u)) continue;
    out.push(rows[j]);
  }
  if (out.length !== rows.length) FILTER_INFO = '显示 ' + out.length + ' / ' + rows.length + ' 个阶段';
  else FILTER_INFO = '';
  return out;
}

function onFilterChange() {
  var si = document.getElementById('searchInput');
  var ss = document.getElementById('statusSel');
  var so = document.getElementById('sortSel');
  FILTER_TEXT = si ? String(si.value || '').trim() : '';
  FILTER_STATUS = ss ? ss.value : 'all';
  SORT_KEY = so ? so.value : 'risk';
  refreshChart();
}

// ===== 风险看板(阶段粒度, 点击展开清单并可跳转机型阶段图) =====
function renderRiskBoard() {
  var box = document.getElementById('riskBoard');
  if (!box) return;
  var units = stageUnits();
  var delay = [], due = [], stale = [];
  for (var i = 0; i < units.length; i++) {
    if (units[i].delayed) delay.push(units[i]);
    if (units[i].dueThisWeek) due.push(units[i]);
    if (units[i].stale) stale.push(units[i]);
  }
  var byRisk = function(a, b) { return b.riskDays - a.riskDays; };
  delay.sort(byRisk); stale.sort(function(a, b) { return b.overdueDays - a.overdueDays; });

  var html = '';
  html += riskCard('delay', 'rc-delay', delay.length, '阶段延期');
  html += riskCard('due', 'rc-due', due.length, '本周到期');
  html += riskCard('stale', 'rc-stale', stale.length, '超30天未闭环');
  box.innerHTML = html;

  var det = document.getElementById('riskDetail');
  if (!det) return;
  if (!RISK_OPEN) { det.style.display = 'none'; det.innerHTML = ''; return; }
  var src = (RISK_OPEN === 'delay') ? delay : (RISK_OPEN === 'due' ? due : stale);
  if (!src.length) { det.style.display = 'block'; det.innerHTML = '<span style="color:#909399">没有符合条件的阶段</span>'; return; }
  var chips = '';
  for (var k = 0; k < src.length; k++) {
    var u = src[k];
    var extra = (RISK_OPEN === 'delay') ? ('延期 ' + u.riskDays + ' 天')
              : (RISK_OPEN === 'due') ? ('计划最后一环 ' + fmtDateShort(u.planEnd))
              : ('超期 ' + u.overdueDays + ' 天');
    chips += '<span class="risk-chip" title="点击查看该机型各阶段进度" onclick="openMachineStage(\''
           + String(u.resource).replace(/'/g, "\\'") + '\')">' + escHtml(u.resource) + ' · ' + escHtml(u.stage)
           + '<span style="color:#909399">（' + extra + '）</span></span>';
  }
  det.style.display = 'block';
  det.innerHTML = chips;
}
function riskCard(key, cls, num, label) {
  // v20: 数量为 0 加 rc-zero 置灰, 打开态不再压背景色(保留色条语义), 右侧箭头暗示可展开
  return '<div class="risk-card ' + cls + (num === 0 ? ' rc-zero' : '') + (RISK_OPEN === key ? ' rc-open' : '') + '" onclick="toggleRisk(\'' + key + '\')">'
       + '<div class="rc-num">' + num + '</div>'
       + '<div class="rc-label">' + label + '</div>'
       + '<span class="rc-arrow">&#9656;</span></div>';
}
function toggleRisk(key) {
  RISK_OPEN = (RISK_OPEN === key) ? null : key;
  renderRiskBoard();
}
function fmtDateShort(d) {
  if (!d || isNaN(d)) return '—';
  return (d.getMonth() + 1) + '/' + d.getDate();
}
function renderOverviewLegend() {
  var box = document.getElementById('legendBox');
  box.innerHTML = '';
  function grp(title, items) {
    var g = document.createElement('div');
    g.className = 'legend-group';
    var h = '<div class="legend-group-title">' + title + '</div>';
    for (var i = 0; i < items.length; i++) {
      h += '<div class="legend-depth-row">' +
        (items[i][0] ? '<span class="legend-depth-swatch" style="background:' + items[i][0] + '"></span>' : '') +
        '<span>' + items[i][1] + '</span></div>';
    }
    g.innerHTML = h;
    box.appendChild(g);
  }
  grp('2500KW（含1250kW）', [['#E69508', '在研'], ['#9C6B00', '已完成'], ['#B8BCC4', '已替代']]);
  grp('3450KW（含1750/1000kW）', [['#1F78B4', '在研'], ['#0B3D63', '已完成'], ['#B8BCC4', '已替代']]);
}

// ===== 升级点矩阵表格(概览页下方) =====
// 阶段单元格配色: 背景色 + 非进行中时的文字色; 进行中阶段统一红字
function stageMatrixStyle(cat) {
  if (cat === '一阶段' || cat.indexOf('一阶段') !== -1) return { bg: '#FFF3E0', fg: '#E65100' };
  if (cat === '二阶段' || cat.indexOf('二阶段') !== -1) return { bg: '#E8F5E9', fg: '#2E7D32' };
  if (cat === '板卡升级') return { bg: '#F5F5F5', fg: '#555' };
  if (cat === '批量' || cat.indexOf('批量') !== -1) return { bg: '#E3F2FD', fg: '#1565C0' };
  if (cat === '液流电池') return { bg: '#FCE4EC', fg: '#C2185B' };
  if (cat === '热虹吸') return { bg: '#E0F7F5', fg: '#0891A8' };
  if (cat === '风冷') return { bg: '#F3E5F5', fg: '#6A1B9A' };
  return { bg: '#FAFAFA', fg: '#555' };
}
// 该机型该阶段是否有进行中任务(progress 1~99) → 阶段名标红
function isStageActive(machine, cat) {
  for (var i = 0; i < data.length; i++) {
    var d = data[i];
    if (d.resource !== machine || !d.task) continue;
    if (getStageCategory(d.task, d) !== cat) continue;
    var p = (d.progress == null || d.progress === '' || isNaN(d.progress)) ? 0 : Number(d.progress);
    if (p > 0 && p < 100) return true;
  }
  return false;
}
function renderUpgradeMatrix() {
  var box = document.getElementById('upgradeMatrix');
  if (!box) return;
  box.style.display = '';
  applyEmbeddedUpgrades();
  var order = CAT_2500.concat(CAT_3450);
  var ord2 = ['批量', '一阶段', '二阶段'];
  var html = '<div class="matrix-title">📋 全产品线 · 阶段升级点矩阵</div>';
  html += '<table class="upgrade-matrix"><thead><tr>' +
    '<th style="width:170px;">机型</th><th style="width:140px;">阶段</th><th>升级点</th></tr></thead><tbody>';
  for (var i = 0; i < order.length; i++) {
    var machine = order[i];
    var stages = {}, stageOrder = [];
    for (var j = 0; j < data.length; j++) {
      var d = data[j];
      if (d.resource !== machine || !d.task) continue;
      var cat = getStageCategory(d.task, d);
      if (stages[cat] == null) { stages[cat] = { upgrade: '' }; stageOrder.push(cat); }
      if (d.upgrade && !stages[cat].upgrade) stages[cat].upgrade = d.upgrade;
    }
    stageOrder.sort(function(a, b) {
      var ai = ord2.indexOf(a), bi = ord2.indexOf(b);
      if (ai === -1 && bi === -1) return 0;
      if (ai === -1) return 1;
      if (bi === -1) return -1;
      return ai - bi;
    });
    var n = stageOrder.length || 1;
    for (var s = 0; s < n; s++) {
      html += '<tr>';
      if (s === 0) html += '<td rowspan="' + n + '" class="matrix-machine">' + escHtml(machine) + '</td>';
      var cat = stageOrder[s] || '';
      var disp = STAGE_DISPLAY[cat] || cat;
      var st = stageMatrixStyle(cat);
      var active = cat ? isStageActive(machine, cat) : false;
      var stageCell = cat
        ? '<span style="background:' + st.bg + ';color:' + (active ? '#B37508' : st.fg) +   // v17: 进行中改用琥珀色, 红色保留给「延期/风险」
          ';padding:3px 12px;border-radius:12px;font-weight:600;display:inline-block;">' + escHtml(disp) + '</span>'
        : '<span style="color:#bbb;">—</span>';
      html += '<td class="matrix-stage">' + stageCell + '</td>';
      var upg = (cat && stages[cat]) ? stages[cat].upgrade : '';
      html += '<td class="matrix-upgrade">' + (upg ? escHtml(upg) : '<span style="color:#c0c4cc;">—</span>') + '</td>';
      html += '</tr>';
    }
  }
  html += '</tbody></table>';
  box.innerHTML = html;
}

function getStages(src) {
  src = src || data;
  var stages = [];
  for (var i = 0; i < src.length; i++)
    if (src[i].task && String(src[i].task).trim() && stages.indexOf(src[i].task) === -1) stages.push(src[i].task);
  return stages;
}

// CSV 字段转义: 含逗号/引号/换行的字段用双引号包裹(导出→导入往返不丢列)
function csvEscape(v) {
  v = String(v == null ? '' : v);
  if (/[",\r\n]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
  return v;
}

function exportCSV() {
  // 双行格式:每个任务两行(计划行 + 实际行),阶段与任务分列
  var csv = '\ufeff资源,类型,阶段,任务,开始,结束,进度,升级点\n';
  for (var i = 0; i < data.length; i++) {
    var r = data[i];
    var stg = r.stage || '';
    var p = (r.progress != null && r.progress !== '' && !isNaN(r.progress)) ? r.progress : '';
    csv += csvEscape(r.resource) + ',计划,' + csvEscape(stg) + ',' + csvEscape(r.task) + ',' + r.start + ',' + r.end + ',,' + csvEscape(r.upgrade || '') + '\n';
    csv += csvEscape(r.resource) + ',实际,' + csvEscape(stg) + ',' + csvEscape(r.task) + ',' + (r.actualStart || r.start) + ',' + (r.actualEnd || r.end) + ',' + p + ',\n';
  }
  var blob = new Blob([csv], {type:'text/csv'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'gantt_v3_data.csv'; a.click();
}

// 自动识别 CSV 编码:BOM 优先 → 严格 UTF-8 试解 → 失败回退 GBK(中文 Windows Excel 默认)
function decodeCSVBuffer(buf) {
  var b = new Uint8Array(buf);
  if (b.length >= 3 && b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF) {
    return new TextDecoder('utf-8').decode(b.subarray(3));          // UTF-8 BOM
  }
  if (b.length >= 2 && b[0] === 0xFF && b[1] === 0xFE) {
    return new TextDecoder('utf-16le').decode(b.subarray(2));       // UTF-16 LE
  }
  if (b.length >= 2 && b[0] === 0xFE && b[1] === 0xFF) {
    return new TextDecoder('utf-16be').decode(b.subarray(2));       // UTF-16 BE
  }
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(b);     // 无 BOM,先严格按 UTF-8
  } catch (e) {
    return new TextDecoder('gbk').decode(b);                        // 非合法 UTF-8 → GBK
  }
}

// 统一导入:同一个 CSV 一次同时刷新甘特图 + 各阶段版本改进表
function importCSV(e) {
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function() {
    var text;
    try {
      text = decodeCSVBuffer(r.result);
    } catch (err) {
      alert('文件编码识别失败: ' + err.message);
      return;
    }
    // 甘特图(原有逻辑,含成功提示)
    try { parseAndApplyCSV(text); } catch (err) { alert('甘特图数据解析失败: ' + err.message); }
    // 改进表(静默:无改进列/无数据时不弹窗、不清空已有数据)
    try { parseImproveCSV(text, true); } catch (err) { console.warn('改进表解析失败', err); }
  };
  r.readAsArrayBuffer(f);
  e.target.value = '';
}

function normDateStr(s) {
  return (s || '').replace(/\//g, '-').replace(/年|月/g, '-').replace(/日/g, '').trim();
}

// 带引号的 CSV 行解析: 支持 "文本,含逗号" 与 "" 转义引号, 避免升级点含逗号时列错位
function parseCSVLine(line, delim) {
  var out = [], cur = '', inQ = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (inQ) {
      if (ch === '"') {
        if (line[i+1] === '"') { cur += '"'; i++; }
        else inQ = false;
      } else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === delim) { out.push(cur); cur = ''; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out;
}

function parseAndApplyCSV(text) {
  var lines = text.trim().split(/\r?\n/).filter(function(l){ return l.trim(); });
  if (lines.length < 2) { alert('文件为空或只有表头,共识别到 ' + lines.length + ' 行'); return; }
  var header = lines[0];
  var delim = ',';
  if ((header.match(/;/g) || []).length > (header.match(/,/g) || []).length) delim = ';';
  if ((header.match(/\t/g) || []).length > (header.match(delim === ',' ? /,/g : delim === ';' ? /;/g : /\t/g) || []).length) delim = '\t';
  var cols = parseCSVLine(header, delim).map(function(s){ return s.trim().replace(/^\ufeff/, ''); });

  // 列识别:先精确识别"实际/计划/类型",再做通用兜底
  var idx = { resource: -1, task: -1, type: -1, stage: -1,
              planStart: -1, planEnd: -1, actualStart: -1, actualEnd: -1, progress: -1 };
  function findCol(re) { for (var i = 0; i < cols.length; i++) if (re.test(cols[i])) return i; return -1; }
  idx.resource = findCol(/资源|产品机型|机型|resource/i);
  idx.task = findCol(/任务|task/i);          // 只匹配"任务"(不含"阶段")
  idx.stage = findCol(/阶段|stage/i);        // 独立"阶段"列(可选)
  if (idx.task < 0 && idx.stage >= 0) idx.task = idx.stage;  // 兼容旧格式:只有"阶段"列时用它当任务
  idx.type = findCol(/类型|type/i);
  idx.actualStart = findCol(/实际开始|actual\s*start/i);
  idx.actualEnd = findCol(/实际结束|actual\s*end/i);
  idx.planStart = findCol(/计划开始|plan\s*start/i);
  idx.planEnd = findCol(/计划结束|plan\s*end/i);
  if (idx.planStart < 0) idx.planStart = findCol(/开始|start/i);  // 无"实际开始"列时命中唯一的开始列
  if (idx.planEnd < 0) idx.planEnd = findCol(/结束|end/i);
  idx.progress = findCol(/进度|progress/i);
  idx.upgrade = findCol(/升级点|升级内容|主要升级|upgrade/i);

  // 行数据
  var rows = [];
  for (var i = 1; i < lines.length; i++) {
    rows.push(parseCSVLine(lines[i], delim).map(function(s){ return s.trim(); }));
  }

  var newData = [];
  var keyMap = {};  // "资源||任务" → newData 索引(用于双行格式配对)

  function ensureEntry(res, task, stage) {
    var key = res + '||' + task + (stage ? '||' + stage : '');
    if (keyMap[key] != null) return keyMap[key];
    var e = { resource: res, task: task, stage: stage || '', start: '', end: '', progress: null };
    newData.push(e); keyMap[key] = newData.length - 1;
    return newData.length - 1;
  }

  if (idx.type >= 0) {
    // === 模式A:双行格式(类型=计划/实际)===
    for (var i = 0; i < rows.length; i++) {
      var p = rows[i];
      var res = p[idx.resource] || '';
      var task = p[idx.task] || '';
      if (!res || !task) continue;
      var stg = (idx.stage >= 0 && p[idx.stage]) ? p[idx.stage].trim() : '';
      var isActual = /实|actual/i.test(p[idx.type] || '');
      // 双行格式里开始/结束列是共用的(计划行=计划日期,实际行=实际日期)
      var dS = normDateStr(idx.planStart >= 0 ? p[idx.planStart] : '');
      var dE = normDateStr(idx.planEnd >= 0 ? p[idx.planEnd] : '');
      var progRaw = ((idx.progress >= 0 && p[idx.progress]) ? p[idx.progress] : '').trim();
      var prog = parseInt(progRaw, 10);
      var ei = ensureEntry(res, task, stg);
      // 升级点列:计划/实际行填了都认,同任务以先出现的为准
      var upgRaw = (idx.upgrade >= 0 ? (p[idx.upgrade] || '') : '').trim();
      if (upgRaw && !newData[ei].upgrade) newData[ei].upgrade = upgRaw;
      if (isActual) {
        newData[ei].actualStart = dS;
        newData[ei].actualEnd = dE;
        // 进度列留空 → null(条照画但不标百分比);有数字 → 标注
        newData[ei].progress = isNaN(prog) ? null : Math.max(0, Math.min(100, prog));
      } else {
        newData[ei].start = dS;
        newData[ei].end = dE;
      }
    }
  } else {
    // === 模式B:宽表(实际开始/实际结束独立列) 或 模式C:旧5列格式 ===
    if (idx.resource < 0) idx.resource = 0;
    if (idx.task < 0) idx.task = 1;
    if (idx.planStart < 0) idx.planStart = 2;
    if (idx.planEnd < 0) idx.planEnd = 3;
    if (idx.progress < 0 && idx.actualStart < 0) idx.progress = 4;
    for (var i = 0; i < rows.length; i++) {
      var p = rows[i];
      var res = p[idx.resource] || '';
      var task = p[idx.task] || '';
      var stg = (idx.stage >= 0 && p[idx.stage]) ? p[idx.stage].trim() : '';
      var dS = normDateStr(p[idx.planStart] || '');
      var dE = normDateStr(p[idx.planEnd] || '');
      if (!res || !dS || !dE) continue;
      var e = { resource: res, task: task, stage: stg, start: dS, end: dE, progress: null };
      if (idx.upgrade >= 0 && p[idx.upgrade]) e.upgrade = (p[idx.upgrade] || '').trim();
      if (idx.actualStart >= 0 && p[idx.actualStart]) e.actualStart = normDateStr(p[idx.actualStart]);
      if (idx.actualEnd >= 0 && p[idx.actualEnd]) e.actualEnd = normDateStr(p[idx.actualEnd]);
      if (idx.progress >= 0) {
        var prog = parseInt((p[idx.progress] || '').trim(), 10);
        if (!isNaN(prog)) e.progress = Math.max(0, Math.min(100, prog));
      }
      newData.push(e);
    }
  }

  // 清理:计划日期缺失的行(只有实际行没计划行)用实际日期兜底
  for (var i = 0; i < newData.length; i++) {
    var e = newData[i];
    if (!e.start && e.actualStart) e.start = e.actualStart;
    if (!e.end && e.actualEnd) e.end = e.actualEnd;
    // 实际日期若与计划完全相同则清空,避免冗余
    if (e.actualStart === e.start && e.actualEnd === e.end) { e.actualStart = ''; e.actualEnd = ''; }
  }
  newData = newData.filter(function(e){ return e.resource && e.start && e.end; });

  if (newData.length > 0) {
    data = newData; save(); renderTable(); refreshChart();
    sessionStorage.setItem('gantt_csv_imported', '1');
    var cnt = (function(){ var r=[]; for(var i=0;i<data.length;i++) if(r.indexOf(data[i].resource)<0) r.push(data[i].resource); return r.length; })();
    var diffCnt = 0; for (var i = 0; i < data.length; i++) if (data[i].actualStart || data[i].actualEnd) diffCnt++;
    alert('✓ 已导入 ' + newData.length + ' 条数据,' + cnt + ' 个机型' + (diffCnt ? ',其中 ' + diffCnt + ' 条实际日期与计划不同' : ''));
  } else {
    alert('✗ 未识别到有效数据行！\n表头: ' + lines[0] + '\n支持3种格式:\n① 资源,类型,任务,开始,结束,进度(类型=计划/实际)\n② 资源,任务,计划开始,计划结束,实际开始,实际结束,进度\n③ 旧版:资源,任务,开始,结束,进度');
  }
}

// 导出当前甘特图为 PNG 图片(2倍清晰度, 白底)
function exportPNG() {

function exportHTML() {
  // 导出前清理动态渲染残留(chart canvas/左侧标签/图例/矩阵/错误提示),
  // 避免导出文件越滚越大、把旧 canvas 结构也带进新文件

    for (var ci = 0; ci < cleanIds.length; ci++) {
      var cel = document.getElementById(cleanIds[ci]);
      if (cel) cel.innerHTML = '';
    }
  } catch(eClean) {}

  var html = document.documentElement.outerHTML;
  html = html.replace(/var MACHINES = \{[\s\S]*?\};/, 'var MACHINES = ' + JSON.stringify((function () {
    var out = {};
    for (var i = 0; i < data.length; i++) {
      var r = data[i].resource || '未知';
      if (!out[r]) out[r] = { tasks: [] };
      out[r].tasks.push(data[i]);
    }
    return out;
  })()) + ';');
  var blob = new Blob([html], {type: 'text/html;charset=utf-8'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'gantt_v3_' + new Date().toISOString().slice(0,10) + '.html'; a.click();

  // 导出后立即恢复当前页面渲染

}

function importHTML(e) {
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function() {
    try {
      var txt = r.result;
      var arr = null;
      // 新格式: var MACHINES = {...} → 展平为任务数组
      var mm = txt.match(/var MACHINES = (\{.*\});/);
      if (mm) {
        var mach = JSON.parse(mm[1]);
        arr = [];
        for (var mk in mach) {
          var ts = (mach[mk] && mach[mk].tasks) || [];
          for (var i = 0; i < ts.length; i++) {
            var it = JSON.parse(JSON.stringify(ts[i]));
            if (it.progress === '') it.progress = null;
            arr.push(it);
          }
        }
      }
      // 兼容旧格式: var defaultData = [...]
      if (!arr) {
        var dm = txt.match(/var defaultData = (\[[\s\S]*?\]);/);
        if (dm) {
          arr = JSON.parse(dm[1]);
          for (var j = 0; j < arr.length; j++) {
            if (arr[j].progress === '') arr[j].progress = null;
          }
        }
      }
      if (arr) {
        data = arr;
        save(); renderTable(); refreshChart(); alert('导入成功！共 ' + arr.length + ' 条任务');
      } else {
        alert('导入失败: 未找到数据(需要文件内含 var MACHINES = {...} 或 var defaultData = [...])');
      }
    } catch(err) { alert('导入失败: ' + err.message); }
  };
  r.readAsText(f, 'UTF-8'); e.target.value = '';
}

// ===== 图表 =====
function refreshChart() {
  if (typeof echarts === 'undefined') {
    document.getElementById('err').style.display = 'block';
    document.getElementById('err').textContent = 'ECharts 未加载！';
    return;
  }
  document.getElementById('err').style.display = 'none';

  // v4: 按 Tab 模式构造输入数据(渲染引擎本身不变, 只换输入)
  var srcData = getModeData();
  if (!srcData.length) return;
  // v20e: 状态筛选在阶段/任务级生效 —— 只保留命中状态的阶段的任务(否则机型行会带着未闭环阶段一起画出来)
  if (FILTER_STATUS !== 'all') {
    var fsrc = filterTasksByStatus(srcData);
    if (fsrc.length) srcData = fsrc;   // 全不命中时保留原数据(机型级同样不命中, 图为空)
  }
  CURRENT_META = (MODE === 'overview') ? computeMachineMeta() : null;

  // v7: 大类聚合阶段视图(DETAIL_VIEW='stage',无入口保留); 单机型阶段图(isSingleStage)不聚合,按阶段+里程碑展开
  var isSingleStage = MODE.indexOf('stage-') === 0;
  var STAGE_MODE = (MODE !== 'overview' && DETAIL_VIEW === 'stage');
  applyEmbeddedUpgrades();
  if (STAGE_MODE) srcData = buildStageData(srcData);
  else if (isSingleStage) srcData = sortByStageAndStep(srcData);

  // 左列宽度:概览175 / 单机型阶段图280(阶段标题+任务名+升级点) / 其他150
  // v17: 左列宽度同步加宽(概览195 / 单机型阶段图280 / 详情195, 与 yLabels 宽度对应)
  document.getElementById('chartWrap').style.marginLeft = (MODE === 'overview') ? '195px' : (isSingleStage ? '280px' : (STAGE_MODE ? '330px' : '195px'));

  // 单机型阶段视图显示返回按钮
  // v20: 返回入口改到 pageTitle 面包屑(见下方 pt.innerHTML), 页签行不再放按钮
  // 同步 Tab 高亮(stage-xxx 时高亮对应大类 Tab)
  var tabs = document.querySelectorAll('#tabs .tab');
  var tabMode = isSingleStage ? ((CATEGORY_MAP[MODE.slice(6)] === '2500KW') ? 'd2500' : 'd3450') : MODE;
  for (var ti = 0; ti < tabs.length; ti++)
    tabs[ti].classList.toggle('active', tabs[ti].getAttribute('data-mode') === tabMode);

  // 页面标题(单机型阶段视图显示面包屑: ← 返回大类机型列表 / 机型名)
  var pt = document.getElementById('pageTitle');
  if (pt) {
    if (isSingleStage) {
      var bcat2 = (CATEGORY_MAP[MODE.slice(6)] === '2500KW') ? 'd2500' : 'd3450';
      var bcatTxt = (bcat2 === 'd2500') ? '2500KW 机型列表' : '3450KW 机型列表';
      pt.style.display = '';
      pt.innerHTML = '<a class="back-link" onclick="goBackToCategory();return false;">&#8592; ' + bcatTxt + '</a>'
                   + '<span class="crumb-sep">/</span>'
                   + '<span class="page-title-machine">' + escHtml(MODE.slice(6)) + '</span>';
    } else {
      pt.style.display = 'none';
    }
  }

  var stages = getStages(srcData);
  var resources = [];
  if (isSingleStage) {
    // 单机型阶段图: 每行=一个阶段(同阶段所有里程碑并排为一行多块)
    var seenStage = {};
    for (var i = 0; i < srcData.length; i++) {
      if (!srcData[i].task) continue;
      var cat = getStageCategory(srcData[i].task, srcData[i]);
      var disp = STAGE_DISPLAY[cat] || cat;
      if (!seenStage[disp]) { seenStage[disp] = cat; resources.push(disp); }
    }
    // 按阶段顺序排序: 批量→一阶段→二阶段→其他(按首次出现)
    var ord = ['批量', '一阶段', '二阶段'];
    resources.sort(function(a, b) {
      // 通过 dispName 反查 cat
      var ca = null, cb = null;
      for (var k in seenStage) { if (k === a) ca = seenStage[k]; if (k === b) cb = seenStage[k]; }
      var ai = ord.indexOf(ca), bi = ord.indexOf(cb);
      if (ai === -1) ai = 99; if (bi === -1) bi = 99;
      return ai - bi;
    });
  } else {
    for (var i = 0; i < srcData.length; i++)
      if (resources.indexOf(srcData[i].resource) === -1) resources.push(srcData[i].resource);
  }
  // v19: 检索/筛选/排序(单机型阶段图只过滤阶段行; 概览页分组内排序以保持大类标题正确)
  if (isSingleStage) {
    resources = filterStageRows(resources, srcData);
  } else {
    if (!STAGE_MODE) resources.reverse();
    resources = filterSortMachines(resources);
  }

  // yCats 精细网格(每格2px):
  // 概览页:只有一条实际条 → BAR_U=12 + 大组间距24 = 每机型48格=96px
  // 详情页:计划+实际双层 → BAR_U=12 + 内缝4 + 大组间距20 = 每机型48格=96px
  var UNIT = 2;
  var BAR_U = (STAGE_MODE) ? 6 : 12;   // 阶段视图条宽减半(12px)
  var INNER_GAP_U = 4;
  var GROUP_GAP_U = (MODE === 'overview') ? 22 : (isSingleStage ? 32 : 20);
  var GROUP_U = (MODE === 'overview') ? BAR_U + GROUP_GAP_U : BAR_U*2 + INNER_GAP_U + GROUP_GAP_U;
  var yCats = [];
  var rowBase = [];     // rowBase[i] = 资源 i 在网格中的实际起始行(含分隔行偏移)
  var sepRows = [];     // 分隔标题行在网格中的起始行号(概览页用)

  if (MODE === 'overview' && CURRENT_META) {
    // 概览页: 在两组机型前各插入一行分隔标题(占满 GROUP_H 高度); 某组被筛空时不插其标题行
    var n2500ov = 0;
    for (var si = 0; si < resources.length; si++) {
      var sm = CURRENT_META[resources[si]];
      if (sm && sm.category === '2500KW') n2500ov++;
    }
    var gridRow = 0;
    // 第一组分隔标题(仅当该组有机型时插入)
    if (n2500ov > 0) {
      sepRows.push(gridRow);
      for (var u = 0; u < GROUP_U; u++) yCats.push('');
      gridRow += GROUP_U;
    }
    for (var i = 0; i < resources.length; i++) {
      rowBase[i] = gridRow;
      for (var u = 0; u < GROUP_U; u++) yCats.push('');
      gridRow += GROUP_U;
      // 2500KW→3450KW 之间插入第二组分隔标题(仅当 3450 组有机型时)
      if (i === n2500ov - 1 && i < resources.length - 1) {
        sepRows.push(gridRow);
        for (var u = 0; u < GROUP_U; u++) yCats.push('');
        gridRow += GROUP_U;
      }
    }
  } else {
    for (var i = 0; i < resources.length; i++) {
      rowBase[i] = i * GROUP_U;
      for (var u = 0; u < GROUP_U; u++) yCats.push('');
    }
  }

  var globalStart = parseDate(srcData[0].start);
  var globalEnd = parseDate(srcData[0].end);
  for (var i = 0; i < srcData.length; i++) {
    var s = parseDate(srcData[i].start), e = parseDate(srcData[i].end);
    if (s < globalStart) globalStart = s;
    if (e > globalEnd) globalEnd = e;
    // 实际起止日期也要纳入全局范围(实际可能早于/晚于计划)
    var ar = getActualRange(srcData[i]);
    if (ar.start < globalStart) globalStart = ar.start;
    if (ar.end > globalEnd) globalEnd = ar.end;
  }

  // 详情页: 时间轴末端补齐到数据结束月之后的下月1号(让横轴多显示约一个月, 条形整体缩短)
  if (MODE !== 'overview') {
    var padEnd = new Date(globalEnd.getFullYear(), globalEnd.getMonth() + 1, 1);
    if (padEnd > globalEnd) globalEnd = padEnd;
  }

  var maxDays = Math.round((globalEnd - globalStart) / 86400000) + 1;

  // v21: 概览页压缩横轴(4px/天一屏看全局); 详情页 7px/天
  //      详情页不再设 1400px 最小宽度(否则天数少时会被撑开到 9px+/天, 两页密度不一致)
  var pxPerDay = (MODE === 'overview') ? 4 : 7;
  var chartWidth = Math.max((MODE === 'overview' ? 900 : 1000), maxDays * pxPerDay + 180);

  // 每月1号偏移
  var monthDayOffsets = [];
  var cur = new Date(globalStart); cur.setDate(1);
  while (cur <= globalEnd) {
    monthDayOffsets.push(Math.round((cur - globalStart) / 86400000));
    cur.setMonth(cur.getMonth() + 1);
  }
  var markLineData = [];
  for (var mi = 0; mi < monthDayOffsets.length; mi++) {
    markLineData.push({ xAxis: monthDayOffsets[mi] });
  }

  // 当天日期竖线(红色加粗,位置每天自动变化;随横向滚动一起移动)
  var nowD = new Date();
  var today0 = new Date(nowD.getFullYear(), nowD.getMonth(), nowD.getDate());
  var todayOff = Math.round((today0 - globalStart) / 86400000);
  markLineData.push({
    xAxis: todayOff,
    lineStyle: { color: '#F5222D', width: 2, type: 'solid' },
    label: {
      show: true, position: 'start', distance: 6, align: 'right',
      color: '#F5222D', fontSize: 12, fontWeight: 'bold',
      formatter: '今天 ' + today0.getFullYear() + '-' + (today0.getMonth() + 1) + '-' + today0.getDate()
    }
  });

  // rows[i] = 机型 i 的任务列表(按开始日期排序); 单机型阶段图: rows[i] = 该阶段所有里程碑并排(按里程碑深度排序)
  var rows = [];
  var maxSlots = 0;
  for (var i = 0; i < resources.length; i++) {
    var list = [];
    for (var j = 0; j < srcData.length; j++) {
      var d = srcData[j];
      if (isSingleStage) {
        // 按 dispName 匹配阶段
        var cat = getStageCategory(d.task, d);
        var disp = STAGE_DISPLAY[cat] || cat;
        if (disp !== resources[i]) continue;
      } else {
        if (d.resource !== resources[i]) continue;
      }
      // 任务留空 / 计划起止日期缺失或非法 → 不进入图表
      if (!d.task || !String(d.task).trim()) continue;
      if (!d.start || !d.end) continue;
      if (isNaN(parseDate(d.start).getTime()) || isNaN(parseDate(d.end).getTime())) continue;
      list.push(d);
    }
    if (isSingleStage) {
      // 同阶段内按里程碑深度排序(首台装配→测试完成→测试问题闭环→归档/发布)
      list.sort(function(a, b) { return getStageDepth(a.task) - getStageDepth(b.task); });
    } else {
      list.sort(function(a, b) { return parseDate(a.start) - parseDate(b.start); });
    }
    rows.push(list);
    if (list.length > maxSlots) maxSlots = list.length;
  }

  var series = [];
  var N = resources.length;
  var TOTAL_ROWS = yCats.length;  // 精细网格行数(含分隔标题行)

  // 动态画布高度:每组固定66px(计划20+缝6+实际20+组间20)
  var GRID_TOP = 46, GRID_BOTTOM = 25;
  var chartH = GRID_TOP + TOTAL_ROWS * UNIT + GRID_BOTTOM;
  document.getElementById('chart').style.height = chartH + 'px';
  document.getElementById('chartWrap').style.height = (chartH + 20) + 'px';

  // v12: "延期"标签同行去重——同一机型行内多个slot文字会重叠时,只保留层级最高(k最小)的那个
  // key=行带顶行(actualBase), value=已接受标签中心px数组; k递增=层级从高到低,先画先得
  var delayLabelTaken = {};
  var DELAY_LABEL_HALF_PX = 18;   // "延期"2字约30px宽,半径15+3px余量
  var PLOT_W = chartWidth - 35;   // grid.left=5 + grid.right=30

  for (var k = 0; k < maxSlots; k++) {
    var planOff = new Array(TOTAL_ROWS).fill(0);
    var planDurItems = new Array(TOTAL_ROWS).fill(null);

    var actualOff = new Array(TOTAL_ROWS).fill(0);
    var actualDurItems = new Array(TOTAL_ROWS).fill(null);
    // v11:详情页"延期"文字改用 z=999 的顶层标签层绘制,避免被后面画的条块覆盖
    var delayOff = new Array(TOTAL_ROWS).fill(0);
    var delayItems = new Array(TOTAL_ROWS).fill(null);

    for (var i = 0; i < N; i++) {
      var t = rows[i][k] || null;
      var planBase = rowBase[i];              // 计划条起始网格行(含分隔行偏移)
      var actualBase = (MODE === 'overview') ? planBase : (rowBase[i] + BAR_U + INNER_GAP_U);  // 概览页:实际条与机型名同行;详情页:偏移至计划条下方

      if (t) {
        // v3修复:用绝对日期偏移(从全局开始日算起),不再累积。
        // 每个slot独立stack,条直接定位到真实日期,中间空着就空着,重叠就重叠。
        var startOff = Math.round((parseDate(t.start) - globalStart) / 86400000);
        var dur = Math.round((parseDate(t.end) - parseDate(t.start)) / 86400000) + 1;
        if (dur <= 0) dur = 0;

        var hasLabel = (t.progress !== null && t.progress !== undefined && t.progress !== '' && !isNaN(t.progress));
        var progress = hasLabel ? Math.max(0, Math.min(100, parseInt(t.progress, 10))) : null;
        var ar = getActualRange(t);
        // 概览页条块也取实际起止(getActualRange 无实际日期时自动回落到计划)
        var actStartOff = Math.round((ar.start - globalStart) / 86400000);
        var actDur = Math.round((ar.end - ar.start) / 86400000) + 1;
        if (actDur <= 0) actDur = 0;

        var planColor = getColor(t.task, t);

        // v4 概览页: 不画计划条
        if (MODE !== 'overview') {
        // 计划条:offset = 绝对开始偏移
        for (var j = 0; j < BAR_U; j++) {
          var pr = planBase + j;
          planOff[pr] = startOff;
          planDurItems[pr] = { value: dur, itemStyle: { color: planColor } };
        }
        }

        // 实际条:进度为有效数字且 >0 才画;进度=0 或留空(null) → 整块不画(未开始,不留0%)
        // 概览页:每个机型都画完整计划区间条(含规划中/已替代)
        var drawActual = (MODE === 'overview') || (progress !== null && progress > 0);
        var delayed = isDelayed(t);
        var actualBarColor = planColor;
        for (var j = 0; j < BAR_U; j++) {
          var rr = actualBase + j;
          actualOff[rr] = actStartOff;
          if (actDur > 0 && drawActual) {
            actualDurItems[rr] = {
              value: actDur,
              itemStyle: t._decal
                ? { color: actualBarColor, decal: { symbol: 'rect', symbolSize: 1, dashArrayX: [1, 0], dashArrayY: [2, 3], rotation: -Math.PI / 4, color: 'rgba(255,255,255,0.55)' } }
                : { color: actualBarColor }
            };
          }
        }
        // v11:条内文字顶层标签层(与条块同起止, 仅中间行显示文字)
        // v12:同行文字重叠时去重——多个slot的标签中心距<宽度则只留层级最高者
        // v17:延期显示「延期 N 天」
        // v19:偏差标签——延期标红「延期 N 天」, 提前完工标绿「提前 N 天」, 按期不打标
        var isAheadFlag = isAhead(t);
        if (MODE !== 'overview' && drawActual && actDur > 0 && (delayed || isAheadFlag)) {
          var baseText = delayed ? ('延期 ' + getDelayDays(t) + ' 天') : ('提前 ' + getAheadDays(t) + ' 天');
          // v21c: 标签带上任务名(去阶段前缀), 标明是谁在延期/提前
          var shortTask = String(t.task || '');
          if (t.stage && shortTask.indexOf(t.stage) === 0) shortTask = shortTask.slice(t.stage.length);
          var labelText = shortTask ? (shortTask + ' ' + baseText) : baseText;
          // 估算标签像素宽(中文≈11px/字, ASCII≈6px/字)换算成天, 作为透明"标签载体段"宽度
          var lwPx = 0;
          for (var ci = 0; ci < labelText.length; ci++) lwPx += (labelText.charCodeAt(ci) > 255 ? 11 : 6);
          var wDays = Math.max(3, Math.ceil(lwPx / pxPerDay));
          // 初始位置: 实际段水平居中; 与同行已放置标签重叠则右移,
          // 但最多移到"条尾+半个标签宽"(v21d: 标签必须贴着自己的实际条, 没有条块托底就丢弃不显示)
          var segEnd = actStartOff + actDur;
          var cx = actStartOff + Math.floor(actDur / 2) - Math.floor(wDays / 2);
          if (cx < 0) cx = 0;
          var maxCx = segEnd + Math.floor(wDays / 2) - wDays;
          var placed = delayLabelTaken[actualBase] || (delayLabelTaken[actualBase] = []);
          var _ok = true, _guard = 0;
          while (_guard++ < 60) {
            var _hit = -1;
            for (var tc = 0; tc < placed.length; tc++) {
              if (cx < placed[tc][1] + 1 && cx + wDays > placed[tc][0]) { _hit = tc; break; }
            }
            if (_hit === -1) break;
            cx = placed[_hit][1] + 1;
            if (cx > maxCx) { _ok = false; break; }
          }
          if (_ok) {
            placed.push([cx, cx + wDays]);
            var midRow = actualBase + Math.floor(BAR_U / 2);
            for (var j2 = 0; j2 < BAR_U; j2++) {
              var rrD = actualBase + j2;
              delayOff[rrD] = cx;
              delayItems[rrD] = { value: wDays, itemStyle: { color: 'transparent', borderColor: 'transparent' } };
            }
            delayItems[midRow].label = {
              show: true, position: 'inside', formatter: labelText,
              color: delayed ? '#F5222D' : '#1E7B34',
              fontSize: 11, fontWeight: 'bold',
              textBorderColor: '#fff', textBorderWidth: 2
            };
          }
        }
      }
    }

    // v4 概览页: 跳过计划 series (offset + visible 合并成一个 if 块)
    if (MODE !== 'overview') {
    // 计划 offset series(透明):每个slot独立stack,避免与其他slot堆叠叠加
    series.push({
      name: '_pOff' + k, type: 'bar', stack: 'planStack' + k, data: planOff,
      itemStyle: { color: 'transparent', borderColor: 'transparent' },
      label: { show: false }, barCategoryGap: '0%', barGap: '-100%', silent: true, tooltip: { show: false }
    });
    // 计划 visible series(彩色,无文字)
    var planCfg = {
      name: 'planSlot' + k, type: 'bar', stack: 'planStack' + k, data: planDurItems,
      label: { show: false },
      barCategoryGap: '0%', barGap: '-100%',
      z: maxSlots - k   // 开始早的slot层级高:重叠时"前面覆盖后面"
    };
    if (k === 0) {
      planCfg.markLine = {
        silent: true, symbol: 'none',
        lineStyle: { color: '#e8e8e8', type: 'solid', width: 1 },
        label: {
          show: true, position: 'start', distance: 24,
          color: '#333', fontSize: 13,
          formatter: function(params) {
            var d = new Date(globalStart.getTime() + params.value * 86400000);
            return d.getFullYear() + '年' + (d.getMonth() + 1) + '月';
          }
        },
        data: markLineData
      };
    }
    series.push(planCfg);
    }  // v4 概览页 end if
    // 实际 offset series(透明):每个slot独立stack
    series.push({
      name: '_aOff' + k, type: 'bar', stack: 'actualStack' + k, data: actualOff,
      itemStyle: { color: 'transparent', borderColor: 'transparent' },
      label: { show: false }, barCategoryGap: '0%', barGap: '-100%', silent: true, tooltip: { show: false }
    });

    // 实际 visible series(同色=已完成部分,带百分比;未完成留空)
    var actualCfg = {
      name: 'actualSlot' + k, type: 'bar', stack: 'actualStack' + k, data: actualDurItems,
      // v11:条内文字统一由顶层标签层绘制(概览=阶段标签, 详情=延期标签),避免被相邻条块遮挡
      label: { show: false },
      barCategoryGap: '0%', barGap: '-100%',
      z: maxSlots - k   // 开始早的slot层级高:重叠时"前面覆盖后面"
    };
    // 概览页无计划条, 时间轴月份线 + 今天红线挂在第0个实际条series上
    if (k === 0 && MODE === 'overview') {
      actualCfg.markLine = {
        silent: true, symbol: 'none',
        lineStyle: { color: '#e8e8e8', type: 'solid', width: 1 },
        label: {
          show: true, position: 'start', distance: 24,
          color: '#333', fontSize: 13,
          formatter: function(params) {
            var d = new Date(globalStart.getTime() + params.value * 86400000);
            // v17: 统一日期格式(去掉"1日", 与"今天 2026-10-22"风格一致)
            return d.getFullYear() + '年' + (d.getMonth() + 1) + '月';
          }
        },
        data: markLineData
      };
    }
    series.push(actualCfg);

    // v11 详情页: 延期标签顶层(z=999), 与条块同位置, 不会被后面画的条块遮住
    if (MODE !== 'overview') {
      series.push({
        name: '_dlyOff' + k, type: 'bar', stack: 'delayStack' + k, data: delayOff,
        itemStyle: { color: 'transparent', borderColor: 'transparent' },
        label: { show: false }, barCategoryGap: '0%', barGap: '-100%',
        silent: true, tooltip: { show: false }, z: 999
      });
      series.push({
        name: '_dlyDur' + k, type: 'bar', stack: 'delayStack' + k, data: delayItems,
        label: { show: false }, barCategoryGap: '0%', barGap: '-100%',
        silent: true, tooltip: { show: false }, z: 999
      });
    }

    // 概览页: 每slot再加一对透明"标签条"(z最高), 段标签画在其上 —— 不被任何段块遮挡
    if (MODE === 'overview') {
      var labOff = new Array(TOTAL_ROWS).fill(0);
      var labDurItems = new Array(TOTAL_ROWS).fill(null);
      var labTextMap = {};
      for (var li = 0; li < N; li++) {
        var lt = rows[li][k] || null;
        if (!lt || !lt._labelDate) continue;
        var ld = parseDate(lt._labelDate);
        if (isNaN(ld)) continue;
        var w = Math.ceil(String(lt.segLabel || '').length * 0.75) + 2;
        // 段块实际起点(实际起止): 标签不允许超出段块左缘, 避免贴近图表左边界时文字被裁掉
        var arL = getActualRange(lt);
        var segOff = Math.max(0, Math.round((arL.start - globalStart) / 86400000));
        var aOff = Math.round((ld - globalStart) / 86400000) - Math.floor(w / 2);
        if (aOff < segOff) aOff = segOff;
        if (aOff < 0) aOff = 0;
        for (var lj = 0; lj < BAR_U; lj++) {
          var rr2 = rowBase[li] + lj;   // 概览页 actualBase == rowBase[i]
          labOff[rr2] = aOff;
          labDurItems[rr2] = {
            value: w,
            itemStyle: { color: 'transparent', borderColor: 'transparent' },
            // 按段块底色自适应: 浅底深字/深底白字, 无描边
            label: { color: isLightColor(lt.color) ? '#262626' : '#fff' }
          };
        }
        labTextMap[rowBase[li] + Math.floor(BAR_U / 2)] = lt.segLabel || '';
      }
      series.push({
        name: '_labOff' + k, type: 'bar', stack: 'labStack' + k, data: labOff,
        itemStyle: { color: 'transparent', borderColor: 'transparent' },
        label: { show: false }, barCategoryGap: '0%', barGap: '-100%', silent: true, tooltip: { show: false }, z: 999
      });
      series.push({
        name: '_labDur' + k, type: 'bar', stack: 'labStack' + k, data: labDurItems,
        label: {
          show: true, position: 'inside',
          formatter: (function(map) {
            return function(params) { return map[params.dataIndex] || ''; };
          })(labTextMap),
          fontSize: 11, fontWeight: 'bold'
        },
        barCategoryGap: '0%', barGap: '-100%', silent: true, tooltip: { show: false }, z: 999
      });
    }
  }

  document.getElementById('chart').style.width = chartWidth + 'px';

  if (!chart) {
    // 仅首次初始化时清理导出文件可能残留的旧渲染 DOM(防止 canvas 叠加);
    // 不能放在每次 refreshChart 里, 否则切页签时会把活实例的 DOM 清空导致崩溃

    chart = echarts.init(document.getElementById('chart'));
  }
  chart.clear();

  chart.setOption({
    tooltip: {
      trigger: 'item',
      formatter: function(p) {
        // 只显示鼠标悬停的那一根条:当前机型 + 当前阶段 的计划或实际
        var name = p.seriesName || '';
        var isActual = name.indexOf('actualSlot') === 0;
        var isPlan = name.indexOf('planSlot') === 0;
        if (!isActual && !isPlan) return '';
        var slotK = parseInt(name.replace(isActual ? 'actualSlot' : 'planSlot', ''), 10);
        // 通过 rowBase 反查资源索引(分隔行使 dataIndex≠resIdx*GROUP_U)
        var resIdx = -1;
        for (var ri = 0; ri < rowBase.length; ri++) {
          if (p.dataIndex >= rowBase[ri] && p.dataIndex < rowBase[ri] + GROUP_U) { resIdx = ri; break; }
        }
        var t = (resIdx >= 0) ? (rows[resIdx] || [])[slotK] : null;
        if (!t) return '';
        var res = resources[resIdx];
        if (isSingleStage) res = MODE.slice(6);   // 单机型阶段图: 标题显示机型名
        var html = '<b>' + res + '</b><br/>' + p.marker + ' ' + t.task + '<br/>';
        if (isPlan) {
          var planDurDays = Math.round((parseDate(t.end) - parseDate(t.start)) / 86400000) + 1;
          html += '计划：' + t.start + ' ~ ' + t.end + ' (' + planDurDays + '天)';
        } else {
          var ar2 = getActualRange(t);
          // 同时显示计划与实际日期,便于核对延期(实际结束 vs 计划结束)
          html += '计划：' + t.start + ' ~ ' + t.end + '<br/>';
          html += '实际：' + ar2.startStr + ' ~ ' + ar2.endStr;
          if (t.progress !== null && t.progress !== undefined && t.progress !== '' && !isNaN(t.progress)) {
            html += '，完成 ' + t.progress + '%';
          }
          // v3:延期标记(规则1:实际结束晚于计划≥7天;规则2:今天超计划结束≥7天且未100%)
          var dDays = getDelayDays(t);
          var oDays = getOverdueDays(t);
          if (dDays >= DELAY_THRESHOLD_DAYS) {
            html += '<br/><span style="color:#F5222D;font-weight:bold">⚠ 延期 ' + dDays + ' 天</span>(实际结束晚于计划结束)';
          } else if (oDays >= DELAY_THRESHOLD_DAYS && getProgNum(t) < 100) {

    xAxis: {

  window._rowLabelY = [];

  var UNIT = 2;
  var GRID_TOP = 46;
  var BAR_H = UNIT * 12;  // 24px
  var INNER_GAP = UNIT * 4;  // 8px
  var GROUP_GAP = (MODE === 'overview') ? UNIT * 22 : UNIT * 20;
  var GROUP_H = (MODE === 'overview') ? BAR_H + GROUP_GAP : BAR_H*2 + INNER_GAP + GROUP_GAP;

  // 概览页: 计算分隔行偏移(与 refreshChart 一致)
  var lblRowBase = [];   // lblRowBase[i] = 资源 i 的实际行偏移(含分隔行)
  var lblSepRows = [];   // 分隔行行号

    for (var si = 0; si < resources.length; si++) {

    }
    var gr = 0;
    if (n2500lb > 0) { lblSepRows.push(gr); gr++; }  // 第一组分隔标题(组空时不插)
    for (var i = 0; i < resources.length; i++) {
      lblRowBase[i] = gr; gr++;
      if (i === n2500lb - 1 && i < resources.length - 1) {
        lblSepRows.push(gr); gr++;  // 第二组分隔标题
      }
    }
    extraRows = lblSepRows.length;
  } else {
    for (var i = 0; i < resources.length; i++) lblRowBase[i] = i;
  }

  var CHART_H = GRID_TOP + (resources.length + extraRows) * GROUP_H + 25;

  box.style.top = '20px';
  box.style.left = '20px';
  // v17: ▸ 箭头与 row-tag 占位后左右两列都需加宽, 否则徽标被挤出
  box.style.width = (MODE === 'overview') ? '172px' : '168px';

  // 机型链接统一构造函数(可点击提示: ▸ 箭头 + hover 高亮)
  function makeMachineLink(mn) {

    a.href = 'javascript:void(0)';
    a.title = '点击查看该机型各阶段进度';

    return a;

  // 详情页计划行加「计划」标签, 与下方「实际」呼应(概览页只有一条, 不加)
  function appendPlanTag(row) {

    tag.className = 'row-tag';
    tag.textContent = '计划';
    row.appendChild(tag);
  }

  for (var i = 0; i < resources.length; i++) {
    var base = GRID_TOP + lblRowBase[i] * GROUP_H;

    // 计划行(机型名,与20px高计划条垂直居中); v4 概览页附加生命周期徽标
    var planRow = document.createElement('div');
    planRow.className = 'y-label-row';

      var bCls = mm.isReplaced ? 'lc-b-rep' : (mm.status === '已完成' ? 'lc-b-done' : (mm.status === '规划中' ? 'lc-b-plan' : 'lc-b-dev'));
      var bTxt = mm.isReplaced ? '已替代' : mm.status;
      // v9: 概览页机型名也可点击进入该机型阶段图(与详情页机型视图一致)
      planRow.appendChild(makeMachineLink(resources[i]));
      planRow.appendChild(document.createTextNode(' '));
      var ovBadge = document.createElement('span');
      ovBadge.className = 'lc-badge ' + bCls;
      ovBadge.textContent = bTxt;
      planRow.appendChild(ovBadge);
    } else if (MODE !== 'overview') {
      // 详情页机型视图: 点击机型名 → 进入该机型的阶段图
      planRow.appendChild(makeMachineLink(resources[i]));
      appendPlanTag(planRow);

      // v9: 概览页无元数据机型也做成可点击链接(与详情页一致)
      planRow.appendChild(makeMachineLink(resources[i]));

    planRow.style.position = 'absolute';
    planRow.style.left = '0'; planRow.style.right = '0';
    planRow.style.height = BAR_H + 'px';
    planRow.style.top = base + 'px';

    actualRow.style.position = 'absolute';
    actualRow.style.left = '0'; actualRow.style.right = '0';
    actualRow.style.height = BAR_H + 'px';
    // v4 概览页: 不画"实际"标签行(只有一条实际条, 不需要计划/实际两行)
    if (MODE !== 'overview') {
      actualRow.style.top = (base + BAR_H + INNER_GAP) + 'px';
      box.appendChild(actualRow);
    }
  }

  // 概览页: 分隔标题行(占满 GROUP_H 高度,与其他纵坐标行一样)

      sepDiv.style.cssText = 'position:absolute;left:0;right:0;top:' + sepY + 'px;height:' + BAR_H + 'px;display:flex;align-items:center;font-size:13px;font-weight:bold;color:' + sepColors[si2] + ';';
      sepDiv.textContent = '── ' + sepTexts[si2] + ' ──';
      box.appendChild(sepDiv);
    }
  }
}

// v2 图例:按类别分组,每组4级深浅
function renderLegend(stages) {
  var box = document.getElementById('legendBox');
  box.innerHTML = '';

  // 收集出现的所有类别
  var cats = [];
  for (var i = 0; i < stages.length; i++) {
    var c = getStageCategory(stages[i]);
    if (cats.indexOf(c) === -1) cats.push(c);
  }

  // 强制排序表:批量最前,一阶段次之,二阶段再次之,其它按原顺序
  var catOrder = ['批量', '一阶段', '二阶段'];
  cats.sort(function (a, b) {
    var ai = catOrder.indexOf(a);
    var bi = catOrder.indexOf(b);
    if (ai === -1 && bi === -1) return 0;
    if (ai === -1) return 1;
    if (bi === -1) return -1;
    return ai - bi;
  });

  // 图例显示名映射(不改数据里的task名,只改图例标题)
  var catDisplayName = {
    '一阶段': '一阶段降本',
    '二阶段': '二阶段降本'
  };

  // 步骤名(从浅到深)
  var stepNames = ['首台装配完成', '测试完成', '测试问题闭环', '归档完成/发布提单'];

  // 各类别配色组(深浅即步骤,无需单独灰阶说明)
  for (var ci = 0; ci < cats.length; ci++) {
    var cat = cats[ci];
    var palette = getCategoryPalette(cat);  // 已知用stagePalettes,未知用后备池
    var grp = document.createElement('div');
    grp.className = 'legend-group';
    var displayName = catDisplayName[cat] || cat;
    grp.innerHTML = '<div class="legend-group-title">' + displayName + '</div>';
    for (var d = 0; d < 4; d++) {
      var row = document.createElement('div');
      row.className = 'legend-depth-row';
      row.innerHTML = '<span class="legend-depth-swatch" style="background:' + palette[d] + '"></span>' +
        '<span>' + stepNames[d] + '</span>';
      grp.appendChild(row);
    }
    box.appendChild(grp);
  }

  // v3: 延期标记图例
  var delayGrp = document.createElement('div');
  delayGrp.className = 'legend-group';
  delayGrp.innerHTML = '<div class="legend-group-title">延期标记</div>' +
    '<div class="legend-depth-row"><span>①实际结束晚于计划 ≥ ' + DELAY_THRESHOLD_DAYS + ' 天;或②今天已超计划结束 ≥ ' + DELAY_THRESHOLD_DAYS + ' 天且未 100%</span></div>';
  box.appendChild(delayGrp);
}
